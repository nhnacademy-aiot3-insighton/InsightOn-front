spring.application.name=insighton-front

server.port=8400

management.endpoints.web.exposure.include=health
service-url.gateway=http://localhost:8080
server.forward-headers-strategy=framework

spring.config.import=classpath:config/dev/redis.properties, classpath:config/dev/zipkin.properties

logging.level.root=INFO
logging.level.com.nhnacademy.insightonfront=DEBUG

# 소셜 로그인 authorize 를 auth(8000) 로 직접 보냄. prod 는 빈 값(ingress 가 /api 를 게이트웨이로 라우팅).
oauth.auth-base-url=http://localhost:8000