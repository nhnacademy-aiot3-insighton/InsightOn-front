<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="sidebar" class="app-sidebar d-flex flex-column">
    <p class="sidebar-label">위치</p>
    <div class="location-links">
        <a th:each="location : ${sidebarLocations}"
           th:href="@{/my-group/location/{id}/dashboard(id=${location.locationId()})}"
           class="location-link" th:text="${location.locationName()}"></a>
    </div>
    <a th:href="@{/my-group/location/list}" class="add-location-link">
        <i class="ti ti-plus"></i>위치 추가
    </a>
</div>

<div th:fragment="manageSidebar(activeSection)" class="app-sidebar d-flex flex-column">
    <p class="sidebar-label">그룹 관리</p>
    <div class="location-links">
        <a th:href="@{/my-group/manage}" class="location-link" th:classappend="${activeSection == 'info'} ? 'active'">그룹 정보</a>
        <a th:href="@{/my-group/members}" class="location-link" th:classappend="${activeSection == 'members'} ? 'active'">멤버 관리</a>
        <a th:href="@{/manage/gateway}" class="location-link" th:classappend="${activeSection == 'gateway'} ? 'active'">게이트웨이 관리</a>
    </div>
</div>

<header th:fragment="groupHeader" class="app-header d-flex align-items-center px-4 gap-4">
    <a th:href="@{/}" class="header-icon-btn text-decoration-none" aria-label="홈"><i class="ti ti-home"></i></a>
    <a th:href="@{/my-group}" class="brand text-decoration-none d-flex align-items-center gap-2">
        <i class="ti ti-chart-line"></i>
        InsightOn <span class="text-muted-group">· 우리회사</span>
    </a>
    <nav class="app-nav d-flex gap-2">
        <a th:href="@{/my-group/reports}" class="nav-link">리포트</a>
        <a th:href="@{/my-group/engine-alerts}" class="nav-link">엔진알람</a>
        <a th:href="@{/my-group/suggestions}" class="nav-link">제안</a>
        <a th:href="@{/my-group/sensors}" class="nav-link">센서</a>
        <a th:href="@{/my-group/flows}" class="nav-link">Flow</a>
    </nav>
    <div class="flex-grow-1"></div>
    <div class="dropdown">
        <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
            그룹 관리
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" th:href="@{/my-group/manage}">그룹 설정</a></li>
            <li><a class="dropdown-item" th:href="@{/my-group/members}">멤버 관리</a></li>
            <li><a class="dropdown-item" th:href="@{/manage/gateway}">게이트웨이 관리</a></li>
        </ul>
    </div>
    <div class="dropdown">
        <button type="button" class="header-icon-btn" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="ti ti-bell"></i>
            <span class="notif-count">0</span>
        </button>
        <div class="dropdown-menu dropdown-menu-end notif-dropdown">
            <div class="notif-dropdown-header">
                알림
                <span>0건 안 읽음</span>
            </div>
            <div class="notif-list">
                <div style="padding:12px;color:var(--ink-faint);">불러오는 중...</div>
            </div>
            <div class="notif-dropdown-footer">
                <a th:href="@{/my-group/notifications}">전체 알림 보기</a>
            </div>
        </div>
    </div>
    <div class="dropdown">
        <button type="button" class="rounded-circle bg-primary-subtle border-0 p-0" style="width:32px;height:32px;" data-bs-toggle="dropdown" aria-expanded="false" aria-label="내 계정"></button>
        <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" th:href="@{/mypage}">내 정보</a></li>
            <li><hr class="dropdown-divider"></li>
            <li>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="dropdown-item">로그아웃</button>
                </form>
            </li>
        </ul>
    </div>
    <script th:src="@{/js/notification.js}"></script>
</header>

<header th:fragment="locationHeader(locationName, locationId, autoControlMode)" class="app-header d-flex align-items-center px-4 gap-4">
    <a th:href="@{/}" class="header-icon-btn text-decoration-none" aria-label="홈"><i class="ti ti-home"></i></a>
    <a th:href="@{/my-group}" class="brand text-decoration-none d-flex align-items-center gap-2">
        <i class="ti ti-chart-line"></i>
        우리회사 <i class="ti ti-chevron-right text-muted-group" style="font-size:0.75rem;"></i>
        <span th:text="${locationName}">위치명</span>
    </a>
    <span th:if="${autoControlMode != null}" class="status-badge neutral" style="margin-top:0; white-space:nowrap;"
          th:text="${autoControlMode.name() == 'AI_DIRECT'} ? 'AI 자동 제어' : '제안만 받기'">MODE</span>
    <nav class="app-nav d-flex gap-2">
        <a th:href="@{/my-group/reports(locationId=${locationId})}" class="nav-link active">리포트</a>
        <a th:href="@{/my-group/engine-alerts(locationId=${locationId})}" class="nav-link">엔진알람</a>
        <a th:href="@{/my-group/suggestions(locationId=${locationId})}" class="nav-link">제안</a>
        <a th:href="@{/my-group/sensors(locationId=${locationId})}" class="nav-link">센서</a>
        <a th:href="@{/locations/{locationId}/actuators(locationId=${locationId})}" class="nav-link">액추에이터</a>
    </nav>
    <div class="flex-grow-1"></div>
    <button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#locationManageModal">
        위치 관리
    </button>
    <div class="dropdown">
        <button type="button" class="header-icon-btn" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="ti ti-bell"></i>
            <span class="notif-count">0</span>
        </button>
        <div class="dropdown-menu dropdown-menu-end notif-dropdown">
            <div class="notif-dropdown-header">
                알림
                <span>0건 안 읽음</span>
            </div>
            <div class="notif-list">
                <div style="padding:12px;color:var(--ink-faint);">불러오는 중...</div>
            </div>
            <div class="notif-dropdown-footer">
                <a th:href="@{/my-group/notifications}">전체 알림 보기</a>
            </div>
        </div>
    </div>
    <div class="dropdown">
        <button type="button" class="rounded-circle bg-primary-subtle border-0 p-0" style="width:32px;height:32px;" data-bs-toggle="dropdown" aria-expanded="false" aria-label="내 계정"></button>
        <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" th:href="@{/mypage}">내 정보</a></li>
            <li><hr class="dropdown-divider"></li>
            <li>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="dropdown-item">로그아웃</button>
                </form>
            </li>
        </ul>
    </div>
    <script th:src="@{/js/notification.js}"></script>
</header>

<div th:fragment="locationManageModal(locationId, locationName, autoControlMode)"
     class="modal fade" id="locationManageModal" tabindex="-1" aria-hidden="true"
     th:attr="data-location-id=${locationId}, data-current-mode=${autoControlMode != null ? autoControlMode.name() : 'SUGGESTION'}">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">위치 관리</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="locationManageError" class="field-hint danger" style="display:none; margin-bottom: var(--sp-4);"></div>
                <div class="settings-field">
                    <label for="locationManageName">이름</label>
                    <input type="text" id="locationManageName" class="form-control" th:value="${locationName}">
                </div>
                <div class="settings-field">
                    <label for="locationManageMode">자동 제어 모드</label>
                    <select id="locationManageMode" class="form-select">
                        <option value="SUGGESTION" th:selected="${autoControlMode == null or autoControlMode.name() == 'SUGGESTION'}">제안만 받기 (SUGGESTION)</option>
                        <option value="AI_DIRECT" th:selected="${autoControlMode != null and autoControlMode.name() == 'AI_DIRECT'}">AI 자동 제어 (AI_DIRECT)</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="btnDeleteLocation" class="btn btn-outline-secondary text-danger">위치 삭제</button>
                <div class="flex-grow-1"></div>
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" id="btnSaveLocation" class="btn btn-primary">저장</button>
            </div>
        </div>
    </div>
</div>

<div th:fragment="chatWidget">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <button type="button" class="chat-fab" data-bs-toggle="offcanvas" data-bs-target="#aiChatPanel" aria-controls="aiChatPanel">
        <i class="ti ti-message-chatbot"></i>
    </button>

    <div class="offcanvas offcanvas-end chat-offcanvas" tabindex="-1" id="aiChatPanel" aria-labelledby="aiChatPanelLabel"
         th:attr="data-location-id=${locationId != null ? locationId : ''}">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="aiChatPanelLabel"><i class="ti ti-message-chatbot"></i>AI 어시스턴트</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column p-0">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-bubble bot">안녕하세요! InsightOn AI 어시스턴트예요. 무엇을 도와드릴까요?</div>
            </div>
            <form class="chat-input-row" id="chatForm">
                <input type="text" class="form-control" id="chatInput" placeholder="메시지를 입력하세요" autocomplete="off">
                <button type="submit" class="chat-send-btn"><i class="ti ti-send"></i></button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
