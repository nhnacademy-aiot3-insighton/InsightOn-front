<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<div class="auth-split">

    <div class="auth-visual" aria-hidden="true">
        <a th:href="@{/}" class="auth-visual-brand">
            <span th:replace="~{fragments/layout :: brandMark}"></span>
            InsightOn
        </a>
        <div class="auth-visual-art">
            <div class="callout c1">온도 <span class="val">23.4°C</span></div>
            <div class="callout c2">습도 <span class="val">48%</span></div>
            <div class="callout c3">CO2 <span class="val">612ppm</span></div>
            <div class="callout c4">플로우 <span class="val">가동 중</span></div>

            <svg width="260" height="260" viewBox="0 0 220 220" fill="none">
                <polygon points="110,190 190,150 110,110 30,150" fill="none" stroke="rgba(108,75,240,.3)" stroke-width="1" stroke-dasharray="2 3"/>
                <g stroke="rgba(108,75,240,.65)" stroke-width="1.3" fill="rgba(108,75,240,.06)">
                    <polygon points="70,150 110,170 150,150 110,130"/>
                    <polygon points="70,150 70,160 110,180 110,170"/>
                    <polygon points="150,150 150,160 110,180 110,170"/>
                    <polygon points="70,112 110,132 150,112 110,92"/>
                    <polygon points="70,112 70,122 110,142 110,132"/>
                    <polygon points="150,112 150,122 110,142 110,132"/>
                </g>
                <circle cx="110" cy="150" r="3" fill="#3ecf8e"/>
                <circle cx="110" cy="112" r="3.5" fill="var(--amber, #e08a2f)"/>
                <circle cx="110" cy="112" r="8" fill="#e08a2f" opacity=".2"/>
                <text x="8" y="16" font-family="IBM Plex Mono, monospace" font-size="9" fill="rgba(108,75,240,.5)">FIG. 01 — LIVE STRUCTURE</text>
            </svg>

            <span class="sensor-dot" style="top:20%;left:12%;"></span>
            <span class="sensor-dot success" style="top:34%;left:78%;"></span>
            <span class="sensor-dot warning" style="bottom:22%;left:20%;"></span>
            <span class="sensor-dot" style="bottom:16%;left:70%;"></span>
        </div>

        <div class="auth-visual-copy">
            <p>가입하고 첫 건물을<br>등록해보세요.</p>
            <span>그룹 승인은 몇 분이면 끝나요.</span>
        </div>
    </div>

    <div class="auth-form-panel">
        <div class="auth-form-wrap">
            <a th:href="@{/}" class="brand auth-form-brand">
                <span th:replace="~{fragments/layout :: brandMark}"></span>
                InsightOn
            </a>
            <h1>회원가입</h1>
            <p class="auth-subtitle">이메일 인증을 마치면 바로 가입할 수 있어요.</p>

            <div class="auth-error" th:if="${signupError}">
                <i class="ti ti-alert-circle"></i>
                <span th:text="${signupError}"></span>
            </div>

            <form th:action="@{/signup}" method="post" id="signupForm">
                <input type="hidden" name="emailVerified" id="emailVerifiedInput" value="false">

                <div class="settings-field">
                    <label for="signupEmail">이메일</label>
                    <div class="verify-row">
                        <input type="email" id="signupEmail" name="email" class="form-control" placeholder="you@company.com"
                               th:value="${email}" required>
                        <button type="button" id="btnCheckEmail" class="btn btn-outline-secondary">중복 확인</button>
                    </div>
                    <p id="emailHint" class="field-hint"></p>

                    <div class="verify-row" style="margin-top: var(--sp-2);">
                        <button type="button" id="btnSendCode" class="btn btn-outline-secondary w-100">인증코드 발송</button>
                    </div>
                    <p id="codeStatus" class="verify-status"></p>

                    <div id="codeSection" style="display:none; margin-top: var(--sp-2);">
                        <div class="verify-row">
                            <input type="text" id="verifyCode" class="form-control" placeholder="6자리 인증코드" inputmode="numeric" maxlength="6">
                            <button type="button" id="btnVerifyCode" class="btn btn-outline-secondary">확인</button>
                        </div>
                    </div>
                </div>

                <div class="settings-field">
                    <label for="password">비밀번호</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" class="form-control" placeholder="8자 이상" minlength="8" required>
                        <button type="button" class="password-toggle" aria-label="비밀번호 표시"><i class="ti ti-eye"></i></button>
                    </div>
                    <p id="passwordHint" class="field-hint" data-default="영문·숫자·특수문자를 각각 포함해 8~64자로 입력해주세요.">영문·숫자·특수문자를 각각 포함해 8~64자로 입력해주세요</p>
                </div>

                <div class="settings-field">
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="홍길동" th:value="${name}" required>
                    <p id="nameHint" class="field-hint" data-default="2~100자로 입력해주세요.">2~100자로 입력해주세요</p>
                </div>

                <div class="settings-field">
                    <label for="phone">전화번호</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="01012345678" th:value="${phone}" required>
                    <p id="phoneHint" class="field-hint" data-default="'-' 없이 숫자만 입력해 주세요.">'-' 없이 숫자만 입력해 주세요.</p>
                </div>

                <button type="submit" id="btnSubmitSignup" class="btn-landing-primary w-100 justify-content-center" disabled>
                    가입하기<i class="ti ti-arrow-right"></i>
                </button>
                <p class="field-hint" style="text-align:center; margin-top: var(--sp-3);">이메일 인증을 완료하면 가입할 수 있어요.</p>
            </form>

            <div class="auth-divider">또는</div>

            <div class="oauth-list">
                <form th:action="@{/oauth/authorize/google}" method="get">
                    <button type="submit" class="btn-google">
                        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
                            <path fill="#34A853" d="M9 18c2.43 0 4.47-.81 5.96-2.18l-2.92-2.26c-.81.54-1.84.87-3.04.87-2.34 0-4.32-1.58-5.03-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
                            <path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/>
                            <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
                        </svg>
                        Google로 계속하기
                    </button>
                </form>
                <form th:action="@{/oauth/authorize/github}" method="get">
                    <button type="submit" class="btn-google">
                        <svg width="18" height="18" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#181717" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                        </svg>
                        GitHub로 계속하기
                    </button>
                </form>
            </div>

            <p class="auth-footer-note">
                이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a>
            </p>
        </div>
    </div>

</div>

<script th:src="@{/js/auth/signup.js}"></script>
</body>
</html>
