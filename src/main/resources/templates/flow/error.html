<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오류 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="flow-page">

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="app-main flow-detail-main">
        <div class="section-header flow-page-section-header">
            <p class="section-label">Flow Automation</p>
            <a th:href="@{/my-group/flows}" class="btn btn-outline-secondary"><i class="ti ti-list"></i> 목록으로</a>
        </div>

        <div class="flow-detail-card">
            <div class="flow-error-state"
                 th:with="isForbidden=${errorStatus == 403},
                          isNotFound=${errorStatus == 404},
                          isDownstream=${errorStatus == 502 or errorStatus == 503}">
                <span class="flow-error-icon warning" th:if="${isForbidden}"><i class="ti ti-lock"></i></span>
                <span class="flow-error-icon neutral" th:if="${isNotFound}"><i class="ti ti-search"></i></span>
                <span class="flow-error-icon danger" th:if="${isDownstream}"><i class="ti ti-plug-off"></i></span>
                <span class="flow-error-icon warning" th:if="${!isForbidden and !isNotFound and !isDownstream}"><i class="ti ti-alert-triangle"></i></span>

                <h2 th:if="${isForbidden}">권한이 없어요</h2>
                <h2 th:if="${isNotFound}">자동화를 찾을 수 없어요</h2>
                <h2 th:if="${isDownstream}">일시적으로 연결할 수 없어요</h2>
                <h2 th:if="${!isForbidden and !isNotFound and !isDownstream}">요청을 처리하지 못했어요</h2>

                <p th:text="${errorMessage}">문제가 발생했습니다.</p>
                <p class="flow-error-code" th:text="'오류 코드 ' + ${errorStatus}"></p>
                <div class="flow-error-actions">
                    <a th:href="@{/my-group/flows}" class="btn btn-primary">Flow 목록으로</a>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/chat-widget.js}"></script>
</body>
</html>
