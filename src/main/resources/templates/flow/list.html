<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flow - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script th:src="@{/js/theme.js}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="flow-page">

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="app-main flow-list-main">
        <div class="section-header flow-page-section-header">
            <p class="section-label">Flow Automation</p>
            <div class="flow-header-actions">
                <a class="btn btn-outline-secondary" th:href="@{/my-group/flows/trash}"><i class="ti ti-trash"></i> 휴지통</a>
                <a class="btn btn-primary" th:if="${canManage}" th:href="@{/my-group/flows/new}"><i class="ti ti-plus"></i> Flow 추가</a>
            </div>
        </div>

        <div class="flow-list-title-row">
            <div>
                <p class="flow-editor-eyebrow">우리 그룹 자동화</p>
                <h2>자동화 관리</h2>
                <p>어떤 상황에 무엇이 실행되는지 확인하고, 필요한 자동화를 관리하세요.</p>
            </div>
            <form method="get" th:action="@{/my-group/flows}" class="flow-list-filter">
                <label for="flowLocationFilter">위치</label>
                <select id="flowLocationFilter" name="locationId" class="form-select">
                    <option value="">전체 위치</option>
                    <option th:each="loc : ${sidebarLocations}"
                            th:value="${loc.locationId()}"
                            th:text="${loc.locationName()}"
                            th:selected="${selectedLocationId != null and selectedLocationId == loc.locationId()}"></option>
                </select>
                <label for="flowStatusFilter">상태</label>
                <select id="flowStatusFilter" name="status" class="form-select">
                    <option value="">전체 (휴지통 제외)</option>
                    <option value="ACTIVE" th:selected="${selectedStatus != null and selectedStatus.name() == 'ACTIVE'}">활성</option>
                    <option value="INACTIVE" th:selected="${selectedStatus != null and selectedStatus.name() == 'INACTIVE'}">비활성</option>
                    <option value="ERROR" th:selected="${selectedStatus != null and selectedStatus.name() == 'ERROR'}">오류</option>
                </select>
                <button type="submit" class="btn btn-outline-secondary">적용</button>
            </form>
        </div>
        <p class="field-hint" th:if="${not canManage}">
            <i class="ti ti-lock"></i> 현재 계정은 조회만 가능해요. 생성과 변경은 그룹 관리자에게 요청해주세요.
        </p>

        <div class="split-view flow-split-view">
            <div class="split-list flow-list-panel">
                <div class="flow-list-panel-heading">
                    <span>자동화 목록</span>
                    <span class="num" th:text="${#lists.size(flows)} + '개'">0개</span>
                </div>
                <div th:each="group : ${flowsByLocation}" style="margin-bottom: var(--sp-4);">
                    <p class="flow-location-label" th:text="${group.key}">위치</p>
                    <div class="location-summary-list">
                        <a class="split-row" th:each="flow : ${group.value}"
                           th:href="@{/my-group/flows/{flowId}(flowId=${flow.flowId()})}">
                            <span class="flow-list-item-icon"><i class="ti ti-git-branch"></i></span>
                            <div class="flow-list-item-copy">
                                <div class="split-row-title">
                                    <span th:text="${flow.name()}"></span>
                                </div>
                                <div class="split-row-meta"
                                     th:text="${#temporals.format(flow.createdAt(), 'yyyy-MM-dd HH:mm')}"></div>
                            </div>
                            <span class="status-badge success" style="margin-top:0;" th:if="${flow.status().name() == 'ACTIVE'}">활성</span>
                            <span class="status-badge neutral" style="margin-top:0;" th:if="${flow.status().name() == 'INACTIVE'}">비활성</span>
                            <span class="status-badge danger" style="margin-top:0;" th:if="${flow.status().name() == 'ERROR'}">오류</span>
                            <span class="status-badge neutral" style="margin-top:0;" th:if="${flow.status().name() == 'ARCHIVED'}">휴지통</span>
                        </a>
                    </div>
                </div>

                <p class="flow-list-empty" th:if="${#lists.isEmpty(flows)}">
                    <i class="ti ti-git-branch"></i>
                    <strong>조건에 맞는 자동화가 없어요.</strong>
                    <span>상태 조건을 바꾸거나 Flow를 추가해보세요.</span>
                </p>
            </div>

            <div id="detailPanel" class="split-detail flow-detail-panel">
                <p class="split-detail-empty"><i class="ti ti-hand-click"></i> 위에서 자동화를 선택하면 작동 방식을 보여드려요.</p>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/split-detail.js}"></script>
<script th:src="@{/js/chat-widget.js}"></script>
<script th:src="@{/js/flow-panel.js}"></script>
<script>
    initSplitDetail({rowSelector: '.split-list .split-row', panelId: 'detailPanel', contentId: 'detailContent', autoSelectFirst: true});
</script>
</body>
</html>
