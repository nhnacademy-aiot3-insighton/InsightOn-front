<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flow 휴지통 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="flow-page flow-trash-page">

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="app-main flow-list-main">
        <div class="section-header flow-page-section-header">
            <p class="section-label">Flow Automation</p>
            <a class="btn btn-outline-secondary" th:href="@{/my-group/flows}"><i class="ti ti-arrow-left"></i> Flow 목록</a>
        </div>

        <div class="flow-list-title-row">
            <div>
                <p class="flow-editor-eyebrow">삭제한 자동화</p>
                <h2>자동화 휴지통</h2>
                <p>이곳의 자동화는 실행되지 않아요. 다시 사용하거나 완전히 삭제할 수 있습니다.</p>
            </div>
            <button type="button" id="btnEmptyFlowTrash" class="btn btn-outline-secondary text-danger"
                    th:if="${canManage}"
                    th:disabled="${#lists.isEmpty(flows)}">
                <i class="ti ti-trash-x"></i> 휴지통 비우기
            </button>
        </div>
        <p class="field-hint" th:if="${not canManage}">
            <i class="ti ti-lock"></i> 현재 계정은 조회만 가능해요. 복구와 영구 삭제는 그룹 관리자에게 요청해주세요.
        </p>

        <p id="flowTrashError" class="field-hint danger flow-editor-error" style="display:none;"></p>

        <div class="split-view flow-split-view">
            <div class="split-list flow-list-panel">
                <div class="flow-list-panel-heading">
                    <span>휴지통의 자동화</span>
                    <span class="num flow-trash-count" th:text="${#lists.size(flows)} + '개'">0개</span>
                </div>
                <div class="location-summary-list" th:if="${not #lists.isEmpty(flows)}">
                    <div class="flow-trash-list-item" th:each="flow : ${flows}"
                         th:attr="data-flow-id=${flow.flowId()}">
                        <a class="split-row flow-trash-row"
                           th:href="@{/my-group/flows/{flowId}(flowId=${flow.flowId()})}"
                           th:attr="data-flow-id=${flow.flowId()},data-flow-name=${flow.name()}">
                            <span class="flow-list-item-icon"><i class="ti ti-trash"></i></span>
                            <div class="flow-list-item-copy">
                                <div class="split-row-title">
                                    <span th:text="${flow.name()}"></span>
                                </div>
                                <div class="split-row-meta"
                                     th:text="${flow.locationName()} + ' · 생성 ' + ${#temporals.format(flow.createdAt(), 'yyyy-MM-dd HH:mm')}"></div>
                            </div>
                            <span class="status-badge neutral" style="margin-top:0;">휴지통</span>
                        </a>
                        <button type="button" class="btn-flow-trash-menu" aria-label="자동화 작업 메뉴" th:if="${canManage}"
                                th:attr="data-flow-id=${flow.flowId()},data-flow-name=${flow.name()}">
                            <i class="ti ti-dots-vertical"></i>
                        </button>
                    </div>
                </div>

                <p class="flow-list-empty" th:if="${#lists.isEmpty(flows)}">
                    <i class="ti ti-trash-off"></i>
                    <strong>휴지통이 비어 있어요.</strong>
                    <span>삭제한 자동화가 여기에 모입니다.</span>
                </p>
            </div>

            <div id="detailPanel" class="split-detail flow-detail-panel">
                <p class="split-detail-empty"><i class="ti ti-hand-click"></i> 위에서 자동화를 선택하면 내용을 보여드려요.</p>
            </div>
        </div>
    </main>
</div>

<div id="flowTrashContextMenu" class="flow-context-menu" role="menu" hidden th:if="${canManage}">
    <button type="button" class="flow-context-action" data-action="restore" role="menuitem">
        <i class="ti ti-restore"></i> 복구
    </button>
    <button type="button" class="flow-context-action danger" data-action="delete" role="menuitem">
        <i class="ti ti-trash-x"></i> 영구 삭제
    </button>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/split-detail.js}"></script>
<script th:src="@{/js/chat-widget.js}"></script>
<script th:src="@{/js/flow-panel.js}"></script>
<script>
    initSplitDetail({rowSelector: '.split-list .split-row', panelId: 'detailPanel', contentId: 'detailContent', autoSelectFirst: true});
</script>
</body>
</html>
