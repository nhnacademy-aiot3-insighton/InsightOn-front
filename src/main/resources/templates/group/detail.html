<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>그룹 메인 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="app-main">
        <!-- 날씨 히어로 — 강수 중이면 강수 형태가 하늘 상태보다 우선. 배경 그라데이션은
             data-cond(하늘상태) + data-tod(시간대, 아래 스크립트가 부여)로 결정 -->
        <div class="wx" th:if="${weather != null and weather.forecast() != null}"
             th:with="pt=${weather?.current()?.precipitationType()},
                      sky=${weather?.forecast()?.skyStatus()},
                      pm10g=${weather?.airQuality()?.pm10Grade()},
                      pm25g=${weather?.airQuality()?.pm25Grade()},
                      cond=${(pt == '비' or pt == '소나기' or pt == '비/눈') ? 'rain' : (pt == '눈' ? 'snow' : ((sky == '구름많음' or sky == '흐림') ? 'cloudy' : 'clear'))},
                      aqBad=${pm10g == '나쁨' or pm10g == '매우나쁨' or pm25g == '나쁨' or pm25g == '매우나쁨'}"
             th:attr="data-cond=${cond}">
            <div class="wx-body">
                <div class="wx-place">
                    <i class="ti ti-map-pin"></i>
                    <span th:text="${myGroup.groupRegion() != null ? myGroup.groupRegion() : myGroup.name()}">지역</span>
                </div>
                <div class="wx-temp">
                    <span th:text="${weather.current() != null ? weather.current().temp() : weather.forecast().temperature()}">21</span><sup>°C</sup>
                </div>
                <div class="wx-sky">
                    <span th:text="${sky}">구름많음</span>
                    <span th:if="${weather.forecast().forecastPrecipitationType() != null and weather.forecast().forecastPrecipitationType() != '없음'}"
                          th:text="' · ' + ${weather.forecast().forecastPrecipitationType()}"></span>
                </div>
            </div>

            <div class="wx-chips">
                <div class="wx-chip">
                    <span class="k">최고 / 최저</span>
                    <span class="v" th:text="${weather.forecast().maxTemp()} + '° / ' + ${weather.forecast().minTemp()} + '°'">24° / 17°</span>
                </div>
                <div class="wx-chip" th:if="${weather.current() != null}">
                    <span class="k">습도</span>
                    <span class="v" th:text="${weather.current().humidity()} + '%'">58%</span>
                </div>
                <div class="wx-chip">
                    <span class="k">강수확률</span>
                    <span class="v" th:text="${weather.forecast().rainPrecipitation()} + '%'">20%</span>
                </div>
                <div class="wx-chip" th:if="${weather.airQuality() != null}" th:classappend="${aqBad} ? ' bad'">
                    <span class="k">미세먼지 PM10</span>
                    <span class="v" th:text="${weather.airQuality().pm10Value()} + ' · ' + ${pm10g}">32 · 보통</span>
                </div>
                <div class="wx-chip" th:if="${weather.airQuality() != null}"
                     th:classappend="${pm25g == '나쁨' or pm25g == '매우나쁨'} ? ' bad'">
                    <span class="k">초미세먼지 PM2.5</span>
                    <span class="v" th:text="${weather.airQuality().pm25Value()} + ' · ' + ${pm25g}">18 · 보통</span>
                </div>
                <div class="wx-chip" th:if="${weather.current() != null and weather.current().hourlyRainFall() != null}">
                    <span class="k">시간당 강수량</span>
                    <span class="v" th:text="${weather.current().hourlyRainFall()} + 'mm'">0mm</span>
                </div>
            </div>

            <i class="wx-glyph ti"
               th:classappend="${cond == 'rain' ? 'ti-cloud-rain' : (cond == 'snow' ? 'ti-cloud-snow' : (cond == 'clear' ? 'ti-sun' : 'ti-cloud'))}"></i>
            <svg class="wx-wave" viewBox="0 0 1200 60" preserveAspectRatio="none" aria-hidden="true">
                <path d="M0 40 Q 60 40 90 40 T 180 36 Q 220 14 260 34 T 350 40 Q 400 54 450 34 T 560 34 Q 620 12 680 34 T 800 40 Q 860 56 920 36 T 1050 34 Q 1110 20 1160 34 L 1200 34 L 1200 60 L 0 60 Z" fill="currentColor"/>
            </svg>
        </div>
        <p class="split-detail-empty" style="margin-bottom: var(--sp-4);" th:if="${weather == null or weather.forecast() == null}">
            날씨/대기질 정보를 불러오지 못했어요.
        </p>

        <div class="row row-cols-2 row-cols-lg-5 g-2 mb-3">
            <div class="col">
                <div class="widget-card kpi" style="--kpi-accent: var(--primary);">
                    <div class="widget-icon"><i class="ti ti-building"></i></div>
                    <div class="widget-label">그룹</div>
                    <div class="widget-value" th:text="${myGroup.name()}">그룹명</div>
                    <div class="widget-sub" th:text="${myGroup.groupRegion()}">소재지</div>
                </div>
            </div>
            <div class="col">
                <div class="widget-card kpi" style="--kpi-accent: #4ecdc4;">
                    <div class="widget-icon"><i class="ti ti-map-pin"></i></div>
                    <div class="widget-label">전체 위치</div>
                    <div class="widget-value" th:text="${locationCount != null ? locationCount + '곳' : '-'}">-</div>
                </div>
            </div>
            <div class="col">
                <div class="widget-card kpi" style="--kpi-accent: #00b894;">
                    <div class="widget-icon"><i class="ti ti-cpu"></i></div>
                    <div class="widget-label">전체 센서</div>
                    <div class="widget-value" th:text="${sensorCount != null ? sensorCount + '개' : '-'}">-</div>
                </div>
            </div>

            <div class="col" th:if="${gateway != null}">
                <div class="widget-card kpi" style="--kpi-accent: var(--success);"
                     th:classappend="${gateway.status().name() == 'FAULT'} ? ' danger'">
                    <div class="widget-icon"><i class="ti ti-router"></i></div>
                    <div class="widget-label">게이트웨이</div>
                    <div class="widget-value" th:text="${gateway.name()}">-</div>
                    <span class="status-badge success" style="margin-top:0;" th:if="${gateway.status().name() == 'ACTIVE'}">ACTIVE</span>
                    <span class="status-badge danger" style="margin-top:0;" th:if="${gateway.status().name() == 'FAULT'}">FAULT</span>
                </div>
            </div>
            <div class="col" th:if="${gateway == null}">
                <div class="widget-card kpi warning" style="--kpi-accent: var(--warning);">
                    <div class="widget-icon"><i class="ti ti-router-off"></i></div>
                    <div class="widget-label">게이트웨이</div>
                    <div class="widget-value">미등록</div>
                    <div class="widget-sub"><a th:href="@{/manage/gateway}">등록하러 가기</a></div>
                </div>
            </div>

            <div class="col">
                <div class="widget-card kpi" style="--kpi-accent: var(--warning);"
                     th:classappend="${criticalAlertCount != null and criticalAlertCount > 0} ? ' danger'">
                    <div class="widget-icon"><i class="ti ti-alert-triangle"></i></div>
                    <div class="widget-label">엔진 알람</div>
                    <div class="widget-value" th:text="${criticalAlertCount != null ? criticalAlertCount : '-'}">-</div>
                    <span class="status-badge danger" th:if="${criticalAlertCount != null and criticalAlertCount > 0}">CRITICAL</span>
                </div>
            </div>
        </div>

        <p class="section-label">위치 요약</p>
        <div class="location-summary-list" th:if="${locationSummaries != null and not #lists.isEmpty(locationSummaries)}">
            <a th:each="loc : ${locationSummaries}" th:href="@{/my-group/location/{id}/dashboard(id=${loc.locationId()})}" class="location-summary-row">
                <div class="location-summary-name">
                    <span class="location-avatar" th:text="${#strings.substring(loc.locationName(), 0, 1)}">1</span>
                    <span th:text="${loc.locationName()}">위치명</span>
                </div>
                <div class="location-summary-stat"><i class="ti ti-cpu"></i><span th:text="${loc.sensorCount()} + '개 센서'"></span></div>
                <div class="location-summary-stat" th:classappend="${loc.alertCount() > 0} ? 'danger' : 'success'">
                    <i class="ti ti-alert-triangle"></i><span th:text="${loc.alertCount()} + '건'"></span>
                </div>
                <i class="ti ti-chevron-right"></i>
            </a>
        </div>
        <p class="grid-widget-empty py-5" th:if="${locationSummaries != null and #lists.isEmpty(locationSummaries)}">
            등록된 위치가 없어요.
        </p>
        <p class="split-detail-empty" th:if="${locationSummaries == null}">
            위치 요약을 불러오지 못했어요.
        </p>
    </main>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/chat-widget.js}"></script>
<script>
    // 날씨 히어로 배경을 접속 시각(시간대)에 맞춰 저녁/밤 그라데이션으로 전환
    (function () {
        var el = document.querySelector('.wx');
        if (!el) return;
        var h = new Date().getHours();
        if (h >= 20 || h < 6) el.setAttribute('data-tod', 'night');
        else if (h >= 17) el.setAttribute('data-tod', 'dusk');
    })();
</script>
</body>
</html>
