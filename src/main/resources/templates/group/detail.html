<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>그룹 메인 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="app-main">
        <!-- 날씨 & 대기질 — 강수 중이면 강수 형태 아이콘이 하늘 상태보다 우선 -->
        <div class="weather-panel" th:if="${weather != null}">
            <div class="weather-half" th:if="${weather.forecast() != null}">
                <div class="weather-hero">
                    <div class="weather-hero-icon">
                        <i th:if="${weather.current() != null and (weather.current().precipitationType() == '비' or weather.current().precipitationType() == '소나기')}" class="ti ti-cloud-rain"></i>
                        <i th:if="${weather.current() != null and weather.current().precipitationType() == '눈'}" class="ti ti-cloud-snow"></i>
                        <i th:if="${weather.current() != null and weather.current().precipitationType() == '비/눈'}" class="ti ti-cloud-snow"></i>
                        <i th:if="${weather.current() == null or weather.current().precipitationType() == null or weather.current().precipitationType() == '없음'}"
                           th:switch="${weather.forecast().skyStatus()}">
                            <i th:case="'맑음'" class="ti ti-sun"></i>
                            <i th:case="'구름많음'" class="ti ti-cloud"></i>
                            <i th:case="'흐림'" class="ti ti-cloud"></i>
                            <i th:case="*" class="ti ti-help"></i>
                        </i>
                    </div>
                    <div>
                        <div class="weather-hero-temp" th:text="(${weather.current() != null ? weather.current().temp() : weather.forecast().temperature()}) + '°C'">-°C</div>
                        <div class="weather-hero-sky" th:text="${weather.forecast().skyStatus()}">-</div>
                    </div>
                </div>
                <div class="weather-meta-grid">
                    <div class="weather-meta-item">
                        <span>최고</span>
                        <span class="weather-meta-value" th:text="${weather.forecast().maxTemp()} + '°'">-</span>
                    </div>
                    <div class="weather-meta-item">
                        <span>최저</span>
                        <span class="weather-meta-value" th:text="${weather.forecast().minTemp()} + '°'">-</span>
                    </div>
                    <div class="weather-meta-item" th:if="${weather.current() != null}">
                        <span>습도</span>
                        <span class="weather-meta-value" th:text="${weather.current().humidity()} + '%'">-</span>
                    </div>
                    <div class="weather-meta-item">
                        <span>강수확률</span>
                        <span class="weather-meta-value" th:text="${weather.forecast().rainPrecipitation()} + '%'">-</span>
                    </div>
                    <div class="weather-meta-item">
                        <span>강수형태</span>
                        <span class="weather-meta-value" th:text="${weather.forecast().forecastPrecipitationType()}">-</span>
                    </div>
                    <div class="weather-meta-item" th:if="${weather.current() != null}">
                        <span>시간당 강수량</span>
                        <span class="weather-meta-value" th:text="${weather.current().hourlyRainFall()} + 'mm'">-</span>
                    </div>
                </div>
            </div>

            <div class="air-quality-half" th:if="${weather.airQuality() != null}">
                <p class="aq-section-label">대기질</p>
                <div class="aq-metric">
                    <div>
                        <span class="aq-metric-name">미세먼지 PM10</span>
                        <span class="aq-metric-caption" th:text="'24시간 평균 ' + ${weather.airQuality().pm10Value24()} + '㎍/m³'">-</span>
                    </div>
                    <div style="text-align:right;">
                        <span class="aq-metric-value" th:text="${weather.airQuality().pm10Value()}">-</span>
                        <span class="status-badge neutral" style="margin-top:0;"
                              th:if="${weather.airQuality().pm10Grade() == '좋음' or weather.airQuality().pm10Grade() == '보통' or weather.airQuality().pm10Grade() == '정보없음'}"
                              th:text="${weather.airQuality().pm10Grade()}">-</span>
                        <span class="status-badge warning" style="margin-top:0;" th:if="${weather.airQuality().pm10Grade() == '나쁨'}" th:text="${weather.airQuality().pm10Grade()}"></span>
                        <span class="status-badge danger" style="margin-top:0;" th:if="${weather.airQuality().pm10Grade() == '매우나쁨'}" th:text="${weather.airQuality().pm10Grade()}"></span>
                    </div>
                </div>
                <div class="aq-metric">
                    <div>
                        <span class="aq-metric-name">초미세먼지 PM2.5</span>
                        <span class="aq-metric-caption" th:text="'24시간 평균 ' + ${weather.airQuality().pm25Value24()} + '㎍/m³'">-</span>
                    </div>
                    <div style="text-align:right;">
                        <span class="aq-metric-value" th:text="${weather.airQuality().pm25Value()}">-</span>
                        <span class="status-badge neutral" style="margin-top:0;"
                              th:if="${weather.airQuality().pm25Grade() == '좋음' or weather.airQuality().pm25Grade() == '보통' or weather.airQuality().pm25Grade() == '정보없음'}"
                              th:text="${weather.airQuality().pm25Grade()}">-</span>
                        <span class="status-badge warning" style="margin-top:0;" th:if="${weather.airQuality().pm25Grade() == '나쁨'}" th:text="${weather.airQuality().pm25Grade()}"></span>
                        <span class="status-badge danger" style="margin-top:0;" th:if="${weather.airQuality().pm25Grade() == '매우나쁨'}" th:text="${weather.airQuality().pm25Grade()}"></span>
                    </div>
                </div>
            </div>
        </div>
        <p class="split-detail-empty" style="margin-bottom: var(--sp-4);" th:if="${weather == null}">
            날씨/대기질 정보를 불러오지 못했어요.
        </p>

        <div class="row row-cols-2 row-cols-lg-5 g-2 mb-3">
            <div class="col">
                <div class="widget-card">
                    <div class="widget-icon"><i class="ti ti-building"></i></div>
                    <div class="widget-label">그룹</div>
                    <div class="widget-value" th:text="${myGroup.name()}">그룹명</div>
                    <div class="widget-sub" th:text="${#strings.replace(myGroup.groupRegion(), ',', ' ')}">소재지</div>
                </div>
            </div>
            <div class="col">
                <div class="widget-card">
                    <div class="widget-icon"><i class="ti ti-map-pin"></i></div>
                    <div class="widget-label">전체 위치</div>
                    <div class="widget-value" th:text="${locationCount != null ? locationCount + '곳' : '-'}">-</div>
                </div>
            </div>
            <div class="col">
                <div class="widget-card">
                    <div class="widget-icon"><i class="ti ti-cpu"></i></div>
                    <div class="widget-label">전체 센서</div>
                    <div class="widget-value" th:text="${sensorCount != null ? sensorCount + '개' : '-'}">-</div>
                </div>
            </div>

            <div class="col" th:if="${gateway != null}">
                <div class="widget-card" th:classappend="${gateway.status().name() == 'FAULT'} ? ' danger' : ' success'">
                    <div class="widget-icon"><i class="ti ti-router"></i></div>
                    <div class="widget-label">게이트웨이</div>
                    <div class="widget-value" th:text="${gateway.name()}">-</div>
                    <span class="status-badge success" style="margin-top:0;" th:if="${gateway.status().name() == 'ACTIVE'}">ACTIVE</span>
                    <span class="status-badge danger" style="margin-top:0;" th:if="${gateway.status().name() == 'FAULT'}">FAULT</span>
                </div>
            </div>
            <div class="col" th:if="${gateway == null}">
                <div class="widget-card warning">
                    <div class="widget-icon"><i class="ti ti-router-off"></i></div>
                    <div class="widget-label">게이트웨이</div>
                    <div class="widget-value">미등록</div>
                    <div class="widget-sub"><a th:href="@{/manage/gateway}">등록하러 가기</a></div>
                </div>
            </div>

            <div class="col">
                <div class="widget-card" th:classappend="${criticalAlertCount != null and criticalAlertCount > 0} ? ' danger' : ''">
                    <div class="widget-icon"><i class="ti ti-alert-triangle"></i></div>
                    <div class="widget-label">엔진 알람</div>
                    <div class="widget-value" th:text="${criticalAlertCount != null ? criticalAlertCount : '-'}">-</div>
                    <span class="status-badge danger" th:if="${criticalAlertCount != null and criticalAlertCount > 0}">CRITICAL</span>
                </div>
            </div>
        </div>

        <p class="section-label">위치 요약</p>
        <div class="location-summary-list" th:if="${locationSummaries != null and not #lists.isEmpty(locationSummaries)}">
            <a th:each="loc : ${locationSummaries}" th:href="@{/my-group/location/{id}/dashboard(id=${loc.locationId()})}" class="location-summary-row">
                <div class="location-summary-name">
                    <span class="location-avatar" th:text="${#strings.substring(loc.locationName(), 0, 1)}">1</span>
                    <span th:text="${loc.locationName()}">위치명</span>
                </div>
                <div class="location-summary-stat"><i class="ti ti-cpu"></i><span th:text="${loc.sensorCount()} + '개 센서'"></span></div>
                <div class="location-summary-stat" th:classappend="${loc.alertCount() > 0} ? 'danger' : 'success'">
                    <i class="ti ti-alert-triangle"></i><span th:text="${loc.alertCount()} + '건'"></span>
                </div>
                <i class="ti ti-chevron-right"></i>
            </a>
        </div>
        <p class="grid-widget-empty py-5" th:if="${locationSummaries != null and #lists.isEmpty(locationSummaries)}">
            등록된 위치가 없어요.
        </p>
        <p class="split-detail-empty" th:if="${locationSummaries == null}">
            위치 요약을 불러오지 못했어요.
        </p>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/chat-widget.js}"></script>
</body>
</html>
