<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>그룹 신청 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="landing-header">
    <a class="brand" th:href="@{/}">
        <i class="ti ti-chart-line"></i>
        InsightOn
    </a>
</header>

<main class="auth-main">

    <!-- 아직 그룹 신청 이력이 없거나, 이전 신청이 반려/취소돼서 다시 신청할 수 있는 상태 -->
    <div class="auth-card auth-card-wide" th:if="${state == 'FORM'}"
         th:with="prevRegion=${previous != null ? #strings.arraySplit(previous.groupRegion(), ' ') : null}">
        <h1>그룹 신청</h1>
        <p class="auth-subtitle">아직 속한 그룹이 없어요. 그룹을 신청하면 관리자 승인 후 대시보드를 쓸 수 있어요.</p>

        <div class="auth-error" th:if="${previous != null and previous.status().name() == 'REJECTED'}">
            <i class="ti ti-x"></i>
            <span>이전 신청("<span th:text="${previous.groupName()}"></span>")이 반려됐어요. 내용을 확인하고 다시 신청해보세요.</span>
        </div>
        <div class="auth-error" style="background:var(--surface-alt); color:var(--ink-soft); border-color:var(--line);"
             th:if="${previous != null and previous.status().name() == 'CANCELLED'}">
            <i class="ti ti-info-circle"></i>
            <span>이전 신청("<span th:text="${previous.groupName()}"></span>")을 취소했어요. 새로 신청할 수 있어요.</span>
        </div>

        <form id="registrationForm" method="post" th:action="@{/group-registration}">
            <div class="settings-field">
                <label for="groupName">그룹명</label>
                <input class="form-control" id="groupName" name="groupName" placeholder="우리회사" required
                       th:value="${previous != null} ? ${previous.groupName()} : ''"
                       type="text">
            </div>
            <div class="row g-3">
                <div class="col-6 settings-field">
                    <label for="state">시/도</label>
                    <select class="form-select" id="state" name="state" required>
                        <option value="">선택하세요</option>
                        <option th:each="s : ${states}" th:selected="${prevRegion != null and prevRegion[0] == s}"
                                th:text="${s}"
                                th:value="${s}"></option>
                    </select>
                </div>
                <div class="col-6 settings-field">
                    <label for="city">시/군/구</label>
                    <select class="form-select" id="city" name="city" required>
                        <option value="">먼저 시/도를 선택하세요</option>
                    </select>
                </div>
            </div>
            <div class="settings-field">
                <label for="description">설명 <span class="field-hint" style="display:inline; margin:0;">(선택)</span></label>
                <textarea class="form-control" id="description" name="description" placeholder="어떤 그룹인지 간단히 설명해주세요"
                          rows="3"
                          th:text="${previous != null} ? ${previous.description()} : ''"></textarea>
            </div>
            <div class="settings-actions" style="justify-content: stretch;">
                <button class="btn-landing-primary w-100 justify-content-center" type="submit">
                    신청하기<i class="ti ti-arrow-right"></i>
                </button>
            </div>
        </form>

        <script th:inline="javascript">
            const REGISTRATION_INIT = {
                previousState: /*[[${prevRegion != null ? prevRegion[0] : null}]]*/ null,
                previousCity: /*[[${prevRegion != null ? #strings.trim(prevRegion[1]) : null}]]*/ null
            };
        </script>
    </div>

    <!-- 이미 낸 신청이 승인 대기 중인 상태 -->
    <div class="auth-card" th:if="${state == 'PENDING'}">
        <div class="registration-status-head">
            <h1 style="margin-bottom:0;">그룹 신청</h1>
            <span class="status-badge warning">PENDING</span>
        </div>
        <p class="auth-subtitle">관리자 승인을 기다리고 있어요. 페이지를 새로고침하면 최신 상태를 확인할 수 있어요.</p>

        <dl style="margin:0;">
            <div class="registration-detail-row">
                <dt>그룹명</dt>
                <dd th:text="${registration.groupName()}"></dd>
            </div>
            <div class="registration-detail-row">
                <dt>소재지</dt>
                <dd th:text="${registration.groupRegion()}"></dd>
            </div>
            <div class="registration-detail-row">
                <dt>신청일</dt>
                <dd th:text="${#temporals.format(registration.createdAt(), 'yyyy-MM-dd')}"></dd>
            </div>
        </dl>

        <form method="post" style="margin-top: var(--sp-6);" th:action="@{/group-registration/cancel}">
            <input name="groupRegistrationId" th:value="${registration.groupRegistrationId()}" type="hidden">
            <button class="btn btn-outline-secondary w-100" type="submit">신청 취소</button>
        </form>
    </div>

    <!-- 과거 신청 이력 (현재 화면에 나온 최신 건 제외, 최신순) -->
    <div class="auth-card auth-card-wide" th:if="${history != null and !history.isEmpty()}" style="margin-top: var(--sp-6);">
        <h1 style="font-size:1.125rem; margin-bottom: var(--sp-2);">지난 신청 내역</h1>
        <dl style="margin:0;">
            <div class="registration-detail-row" th:each="item : ${history}">
                <dt>
                    <div th:text="${item.groupName()}"></div>
                    <div style="color:var(--ink-faint); font-size:var(--fs-meta); margin-top:2px;"
                         th:text="${item.groupRegion()} + ' · ' + ${#temporals.format(item.createdAt(), 'yyyy-MM-dd')}"></div>
                </dt>
                <dd>
                    <span class="status-badge" style="margin-top:0;" th:classappend="${item.status().badgeClass}"
                          th:text="${item.status().label}"></span>
                </dd>
            </div>
        </dl>
    </div>

    <!-- 이미 대기 중인 신청이 있는데 다시 제출했을 때(409) 뜨는 안내 팝업 -->
    <div class="modal fade" id="registrationConflictModal" tabindex="-1" aria-hidden="true" th:if="${registrationError}">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="ti ti-clock-hour-4" style="color:var(--warning); margin-right: var(--sp-2);"></i>
                        신청 처리 대기 중
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="auth-subtitle" style="margin-bottom:0;" th:text="${registrationError}"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">확인</button>
                </div>
            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/group-registration.js}"></script>
<script th:if="${registrationError}" th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
        new bootstrap.Modal(document.getElementById('registrationConflictModal')).show();
    });
</script>
</body>
</html>
