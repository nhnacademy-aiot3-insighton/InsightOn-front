<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>초대 코드로 그룹 가입 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="landing-header">
    <a class="brand" th:href="@{/}">
        <i class="ti ti-chart-line"></i>InsightOn
    </a>
    <div class="landing-header-actions" style="margin-left:auto;">
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn-landing-secondary">로그아웃</button>
        </form>
    </div>
</header>

<main class="form-page">
    <div class="form-panel form-panel-wide">

        <div class="form-panel-head">
            <span class="form-medallion"><i class="ti ti-ticket"></i></span>
            <div>
                <h1>초대 코드로 그룹 가입</h1>
                <p>전달받은 12자리 초대 코드를 입력하면 관리자 승인 대기 없이 바로 그룹에 참가해요.</p>
            </div>
        </div>

        <div class="auth-error" th:if="${joinError}">
            <i class="ti ti-x"></i>
            <span th:text="${joinError}"></span>
        </div>

        <form id="joinForm" method="post" th:action="@{/my-group/join}">
            <div class="form-section">
                <div class="form-section-label"><i class="ti ti-ticket"></i>초대 코드</div>
                <div class="settings-field">
                    <label for="joinInviteToken">코드 입력</label>
                    <div class="input-group">
                        <input class="form-control" id="joinInviteToken" name="inviteToken" placeholder="12자리 초대 코드" required type="text">
                        <button class="btn btn-outline-secondary d-flex align-items-center gap-1" type="button" onclick="previewGroup('joinInviteToken', 'previewResult')">
                            <i class="ti ti-eye"></i> 그룹 미리보기
                        </button>
                    </div>
                    <div id="previewResult" style="display: none; margin-top: var(--sp-3);"></div>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn-landing-secondary" type="button" onclick="history.back()">뒤로가기</button>
                <span class="spacer"></span>
                <button class="btn-landing-primary" type="submit">가입하기</button>
            </div>
        </form>

        <div class="form-panel-foot">
            초대 코드가 없으신가요?
            <a th:href="@{/group-registration}">새 그룹 신청하기</a>
        </div>
    </div>
</main>

<script th:src="@{/js/group-registration.js}"></script>
</body>
</html>
