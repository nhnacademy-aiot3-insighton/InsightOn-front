<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${sensor.sensorName()} + ' - InsightOn'">센서 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="app-main">
        <p class="section-label">
            <a th:href="@{/sensors}" style="color:var(--ink-soft); text-decoration:none;">
                <i class="ti ti-arrow-left"></i> 센서
            </a>
        </p>

        <div id="detailContent" class="settings-card" th:attr="data-sensor-id=${sensor.sensorId()}" style="max-width: 600px;">
            <div id="saveStatus" class="field-hint danger" style="display:none; margin-bottom: var(--sp-4);"></div>

            <div class="settings-field">
                <label for="sensorName">이름</label>
                <input type="text" id="sensorName" class="form-control" th:value="${sensor.sensorName()}">
            </div>
            <div class="settings-field">
                <label for="sensorLocation">위치</label>
                <select id="sensorLocation" class="form-select">
                    <option th:each="loc : ${locations}" th:value="${loc.locationId()}" th:text="${loc.locationName()}"
                            th:selected="${loc.locationId() == sensor.locationId()}"></option>
                </select>
            </div>

            <div class="gateway-status-meta" style="border-top:none; margin-top:0; padding-top:0;">
                <div class="gateway-status-meta-row">
                    <span>EUI</span>
                    <span class="gateway-status-meta-value" th:text="${sensor.sensorEui()}"></span>
                </div>
                <div class="gateway-status-meta-row">
                    <span>등록일</span>
                    <span class="gateway-status-meta-value" th:text="${#temporals.format(sensor.createdAt(), 'yyyy-MM-dd')}"></span>
                </div>
                <div class="gateway-status-meta-row">
                    <span>마지막 통신</span>
                    <span class="gateway-status-meta-value"
                          th:text="${sensor.lastSeenAt() != null ? #temporals.format(sensor.lastSeenAt(), 'yyyy-MM-dd HH:mm') : '기록 없음'}"></span>
                </div>
            </div>

            <div class="settings-field" style="margin-top: var(--sp-4);">
                <label>등록된 필드</label>
                <div class="chip-select" style="flex-wrap: wrap; gap: var(--sp-2);" th:if="${not #lists.isEmpty(attributes)}">
                    <span class="chip-option" style="cursor:default; display:inline-flex; align-items:center; gap: var(--sp-2);"
                          th:each="attr : ${attributes}">
                        <span th:text="${attr.displayName()} + ' (' + ${attr.unit()} + ')'"></span>
                        <button type="button" class="btn-remove-attribute" aria-label="필드 삭제"
                                th:attr="data-metric-key=${attr.metricKey()}"
                                style="border:none; background:none; color:var(--ink-faint); line-height:1; padding:0;">
                            <i class="ti ti-x"></i>
                        </button>
                    </span>
                </div>
                <p class="field-hint" th:if="${#lists.isEmpty(attributes)}">등록된 필드가 없어요.</p>
            </div>

            <div class="settings-actions">
                <button type="button" id="btnDeleteSensor" class="btn btn-outline-secondary text-danger">센서 삭제</button>
                <div style="flex:1;"></div>
                <button type="button" id="btnSaveSensor" class="btn btn-primary">저장</button>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sensor-panel.js}"></script>
<script th:src="@{/js/chat-widget.js}"></script>
</body>
</html>
