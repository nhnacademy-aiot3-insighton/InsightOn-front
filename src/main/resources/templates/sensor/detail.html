<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${sensor.sensorName()} + ' - InsightOn'">센서 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="app-main">
        <p class="section-label">
            <a th:href="@{/my-group/sensors}" style="color:var(--ink-soft); text-decoration:none;">
                <i class="ti ti-arrow-left"></i> 센서
            </a>
        </p>

        <div id="detailContent" class="settings-card" th:attr="data-sensor-id=${sensor.sensorId()}" style="max-width: 100%;">
            <div style="display:flex; align-items:center; gap: var(--sp-3); margin-bottom: var(--sp-4);">
                <span class="status-badge success" style="margin-top:0;" th:if="${sensor.isOnline()}"><i class="ti ti-plug-connected"></i> 온라인</span>
                <span class="status-badge neutral" style="margin-top:0;" th:unless="${sensor.isOnline()}"><i class="ti ti-plug-connected-x"></i> 오프라인</span>
                <span class="field-hint" style="margin-top:0;" th:text="${sensor.sensorEui()}"></span>
            </div>
            <div id="saveStatus" class="field-hint danger" style="display:none; margin-bottom: var(--sp-4);"></div>

            <div class="sensor-detail-grid">
                <div>
                    <!-- MEMBER는 조회만 가능 — 저장/삭제 요청을 보내도 서버(SensorController)가 403으로 막는다 -->
                    <p class="field-hint" th:unless="${canManage}">보기 전용이에요. 이름/위치 수정과 삭제는 매니저 이상만 할 수 있어요.</p>
                    <div class="settings-field">
                        <label for="sensorName">이름</label>
                        <input type="text" id="sensorName" class="form-control" th:value="${sensor.sensorName()}"
                               th:disabled="${not canManage}">
                    </div>
                    <div class="settings-field">
                        <label for="sensorLocation">위치</label>
                        <select id="sensorLocation" class="form-select" th:disabled="${not canManage}">
                            <option th:each="loc : ${locations}" th:value="${loc.locationId()}" th:text="${loc.locationName()}"
                                    th:selected="${loc.locationId() == sensor.locationId()}"></option>
                        </select>
                    </div>
                </div>

                <div class="gateway-status-meta" style="border-top:none; margin-top:0; padding-top:0;">
                    <div class="gateway-status-meta-row">
                        <span>EUI</span>
                        <span class="gateway-status-meta-value" th:text="${sensor.sensorEui()}"></span>
                    </div>
                    <div class="gateway-status-meta-row">
                        <span>등록일</span>
                        <span class="gateway-status-meta-value" th:text="${#temporals.format(sensor.createdAt(), 'yyyy-MM-dd')}"></span>
                    </div>
                    <div class="gateway-status-meta-row">
                        <span>마지막 통신</span>
                        <span class="gateway-status-meta-value"
                              th:text="${sensor.lastSeenAt() != null ? #temporals.format(sensor.lastSeenAt(), 'yyyy-MM-dd HH:mm') : '기록 없음'}"></span>
                    </div>
                </div>
            </div>

            <div class="settings-field" style="margin-top: var(--sp-4);">
                <label>등록된 필드</label>
                <div class="chip-select" style="flex-wrap: wrap; gap: var(--sp-2);" th:if="${not #lists.isEmpty(attributes)}">
                    <span class="chip-option" style="cursor:default; display:inline-flex; align-items:center; gap: var(--sp-2);"
                          th:each="attr : ${attributes}">
                        <span th:text="${attr.unit() != null and not #strings.isEmpty(attr.unit())} ? ${attr.displayName()} + ' (' + ${attr.unit()} + ')' : ${attr.displayName()}"></span>
                        <button type="button" class="btn-remove-attribute" aria-label="필드 삭제"
                                th:attr="data-metric-key=${attr.metricKey()}"
                                style="border:none; background:none; color:var(--ink-faint); line-height:1; padding:0;">
                            <i class="ti ti-x"></i>
                        </button>
                    </span>
                </div>
                <p class="field-hint" th:if="${#lists.isEmpty(attributes)}">등록된 필드가 없어요.</p>
            </div>

            <div class="settings-actions" th:if="${canManage}">
                <button type="button" id="btnDeleteSensor" class="btn btn-outline-secondary text-danger">센서 삭제</button>
                <div style="flex:1;"></div>
                <button type="button" id="btnSaveSensor" class="btn btn-primary">저장</button>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sensor-panel.js}"></script>
<script th:src="@{/js/chat-widget.js}"></script>
</body>
</html>
