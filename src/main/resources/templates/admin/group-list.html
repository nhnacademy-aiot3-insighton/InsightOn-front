<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>그룹 목록 관리 — InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="landing-page">

<header class="landing-header">
    <a class="brand" th:href="@{/admin/main}">
        <i class="ti ti-shield-lock"></i>InsightOn
    </a>
    <nav class="landing-nav">
        <a th:href="@{/admin/users}">회원 조회</a>
        <a th:href="@{/admin/group-registrations}">그룹 신청 관리</a>
        <a class="active" th:href="@{/admin/group-list}">그룹 목록</a>
    </nav>
    <div class="landing-header-actions">
        <a class="landing-greeting" th:href="@{/mypage}" th:if="${userName != null}" th:text="|${userName}님|"></a>
        <form method="post" style="display:inline;" th:action="@{/admin/logout}">
            <button class="btn-landing-secondary" type="submit">로그아웃</button>
        </form>
    </div>
</header>

<section class="landing-section">
    <div class="landing-section-head">
        <div class="landing-section-eyebrow">GROUP MANAGEMENT</div>
        <h2>그룹 목록 관리</h2>
        <p>현재 등록되어 관제 중인 모든 그룹의 정보 및 목록을 확인하세요.</p>
    </div>

    <div class="auth-error mb-3" th:if="${adminError}">
        <i class="ti ti-x"></i>
        <span th:text="${adminError}"></span>
    </div>

    <div class="location-summary-list" style="margin-top: var(--sp-4);" th:if="${groupList != null and not #lists.isEmpty(groupList.content())}">
        <div class="location-summary-row" th:each="group : ${groupList.content()}">
            <div class="location-summary-name">
                <span class="location-avatar" th:text="${#strings.substring(group.name(), 0, 1)}"></span>
                <div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="font-weight-bold" th:text="${group.name()}"></span>
                        <span class="badge bg-light text-dark" style="font-size: 0.75rem;" th:text="'ID: ' + ${group.groupId()}"></span>
                    </div>
                    <div style="color:var(--ink-faint); font-size:var(--fs-meta); margin-top:2px;"
                         th:text="${group.description() != null ? group.description() : '설명 없음'} + ' · 지역: ' + ${group.groupRegion()}"></div>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-primary" style="font-size: 0.8rem; padding: 6px 12px;">운영중</span>
            </div>
        </div>
    </div>

    <p class="grid-widget-empty py-5" th:if="${groupList == null or #lists.isEmpty(groupList.content())}">
        등록된 그룹이 없습니다.
    </p>

    <nav class="list-pagination" th:if="${groupList != null and groupList.totalPages() > 1}">
        <a class="btn-landing-secondary" th:href="@{/admin/group-list(page=${groupList.number()-1})}"
           th:if="${!groupList.first()}">이전</a>
        <span th:text="${groupList.number()+1} + ' / ' + ${groupList.totalPages()}"></span>
        <a class="btn-landing-secondary" th:href="@{/admin/group-list(page=${groupList.number()+1})}"
           th:if="${!groupList.last()}">다음</a>
    </nav>
</section>

<footer class="landing-footer">
    © InsightOn — AIOT 빌딩 통합 관제
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
