<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 로그인 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<div class="auth-split">

    <!-- left: 로그인 페이지와 동일한 패널 언어(건물 일러스트 + 라이브 센서 점) -->
    <div class="auth-visual" aria-hidden="true">
        <a th:href="@{/}" class="auth-visual-brand">
            <i class="ti ti-shield-lock"></i>
            InsightOn <span style="font-family:var(--font-mono); font-size:0.62em; opacity:0.7; letter-spacing:0.08em;">ADMIN</span>
        </a>

        <div class="auth-visual-art">
            <div class="callout c1">회원 <span class="val">1,204명</span></div>
            <div class="callout c2">활성 <span class="val">1,180</span></div>
            <div class="callout c3">차단 <span class="val">12</span></div>
            <div class="callout c4">휴면 <span class="val">12</span></div>

            <svg width="260" height="260" viewBox="0 0 220 220" fill="none">
                <polygon points="110,190 190,150 110,110 30,150" fill="none" stroke="rgba(108,75,240,.3)" stroke-width="1" stroke-dasharray="2 3"/>
                <g stroke="rgba(108,75,240,.65)" stroke-width="1.3" fill="rgba(108,75,240,.06)">
                    <polygon points="70,150 110,170 150,150 110,130"/>
                    <polygon points="70,150 70,160 110,180 110,170"/>
                    <polygon points="150,150 150,160 110,180 110,170"/>
                    <polygon points="70,112 110,132 150,112 110,92"/>
                    <polygon points="70,112 70,122 110,142 110,132"/>
                    <polygon points="150,112 150,122 110,142 110,132"/>
                </g>
                <circle cx="110" cy="150" r="3" fill="#3ecf8e"/>
                <circle cx="110" cy="112" r="3.5" fill="var(--amber, #e08a2f)"/>
                <circle cx="110" cy="112" r="8" fill="#e08a2f" opacity=".2"/>
                <text x="8" y="16" font-family="IBM Plex Mono, monospace" font-size="9" fill="rgba(108,75,240,.5)">FIG. 01 — ADMIN CONSOLE</text>
            </svg>

            <span class="sensor-dot" style="top:20%;left:12%;"></span>
            <span class="sensor-dot success" style="top:34%;left:78%;"></span>
            <span class="sensor-dot warning" style="bottom:22%;left:20%;"></span>
            <span class="sensor-dot" style="bottom:16%;left:70%;"></span>
        </div>

        <div class="auth-visual-copy">
            <p>회원 계정을<br>한 곳에서 관리해요.</p>
            <span>조회 · 차단 · 휴면 · 권한 — 관리자 전용.</span>
        </div>
    </div>

    <!-- right: 관리자 로그인 폼 -->
    <div class="auth-form-panel">
        <div class="auth-form-wrap">
            <a th:href="@{/}" class="brand auth-form-brand">
                <i class="ti ti-shield-lock"></i>
                InsightOn Admin
            </a>
            <h1>관리자 로그인</h1>
            <p class="auth-subtitle">관리자 권한이 있는 계정만 접근할 수 있어요.</p>

            <div class="auth-error" th:if="${loginError}">
                <i class="ti ti-alert-circle"></i>
                <span th:text="${loginError}"></span>
            </div>

            <form th:action="@{/admin/login}" method="post" id="adminLoginForm">
                <div class="settings-field">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" class="form-control" required autofocus>
                </div>
                <div class="settings-field">
                    <label for="password">비밀번호</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" aria-label="비밀번호 표시"><i class="ti ti-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="btn-landing-primary w-100 justify-content-center">
                    관리자 로그인<i class="ti ti-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/login.js}"></script>
</body>
</html>
