<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>그룹 신청 관리 — InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="landing-page">

<header class="landing-header">
    <a class="brand" th:href="@{/admin/main}">
        <i class="ti ti-shield-lock"></i>InsightOn
    </a>
    <nav class="landing-nav">
        <a th:href="@{/admin/users}">회원 조회</a>
        <a th:href="@{/admin/group-registrations}">그룹 신청 관리</a>
    </nav>
    <div class="landing-header-actions">
        <a class="landing-greeting" th:href="@{/mypage}" th:if="${userName != null}" th:text="|${userName}님|"></a>
        <form method="post" style="display:inline;" th:action="@{/admin/logout}">
            <button class="btn-landing-secondary" type="submit">로그아웃</button>
        </form>
    </div>
</header>

<section class="landing-section">
    <div class="landing-section-head">
        <div class="landing-section-eyebrow">GROUP REGISTRATIONS</div>
        <h2>그룹 신청 관리</h2>
        <p>새로 들어온 그룹 생성 신청을 확인하고 승인하거나 거절하세요.</p>
    </div>

    <div class="auth-error" style="margin-bottom: var(--sp-3);" th:if="${adminError}">
        <i class="ti ti-x"></i>
        <span th:text="${adminError}"></span>
    </div>

    <form class="filter-bar" method="get" th:action="@{/admin/group-registrations}">
        <select class="form-select" name="status" onchange="this.form.submit()">
            <option th:selected="${status == null}" value="">전체</option>
            <option th:selected="${status != null and status.name() == 'PENDING'}" value="PENDING">대기중</option>
            <option th:selected="${status != null and status.name() == 'APPROVED'}" value="APPROVED">승인됨</option>
            <option th:selected="${status != null and status.name() == 'REJECTED'}" value="REJECTED">거절됨</option>
            <option th:selected="${status != null and status.name() == 'CANCELLED'}" value="CANCELLED">취소됨</option>
        </select>
    </form>

    <div class="location-summary-list" style="margin-top: var(--sp-4);" th:if="${not #lists.isEmpty(registrations.content())}">
        <div class="location-summary-row" th:each="item : ${registrations.content()}">
            <div class="location-summary-name">
                <span class="location-avatar" th:text="${#strings.substring(item.groupName(), 0, 1)}"></span>
                <div>
                    <div th:text="${item.groupName()}"></div>
                    <div style="color:var(--ink-faint); font-size:var(--fs-meta); margin-top:2px;"
                         th:text="${item.groupRegion()} + ' · ' + ${#temporals.format(item.createdAt(), 'yyyy-MM-dd')}"></div>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="status-badge" style="margin-top:0;" th:classappend="${item.status().badgeClass}"
                      th:text="${item.status().label}"></span>
                <form method="post" style="display:inline;" th:action="@{/admin/group-registrations/{id}/approve(id=${item.groupRegistrationId()})}"
                      th:if="${item.status().name() == 'PENDING'}">
                    <button class="btn-landing-secondary" style="padding: var(--sp-1) var(--sp-3); font-size: var(--fs-meta);" type="submit">승인</button>
                </form>
                <form method="post" style="display:inline;" th:action="@{/admin/group-registrations/{id}/reject(id=${item.groupRegistrationId()})}"
                      th:if="${item.status().name() == 'PENDING'}">
                    <button class="btn btn-outline-secondary" style="padding: var(--sp-1) var(--sp-3); font-size: var(--fs-meta);" type="submit">거절</button>
                </form>
            </div>
        </div>
    </div>

    <p class="grid-widget-empty py-5" th:if="${#lists.isEmpty(registrations.content())}">
        신청 내역이 없어요.
    </p>

    <nav class="list-pagination" th:if="${registrations.totalPages() > 1}">
        <a class="btn-landing-secondary" th:href="@{/admin/group-registrations(status=${status}, page=${registrations.number()-1})}"
           th:if="${!registrations.first()}">이전</a>
        <span th:text="${registrations.number()+1} + ' / ' + ${registrations.totalPages()}"></span>
        <a class="btn-landing-secondary" th:href="@{/admin/group-registrations(status=${status}, page=${registrations.number()+1})}"
           th:if="${!registrations.last()}">다음</a>
    </nav>
</section>

<footer class="landing-footer">
    © InsightOn — AIOT 빌딩 통합 관제
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
