<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>회원 조회 — InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="landing-page">

<header class="landing-header">
    <a class="brand" th:href="@{/admin/main}">
        <i class="ti ti-shield-lock"></i>InsightOn
    </a>
    <nav class="landing-nav">
        <a th:href="@{/admin/users}">회원 조회</a>
        <a th:href="@{/admin/group-registrations}">그룹 신청 관리</a>
    </nav>
    <div class="landing-header-actions">
        <a class="landing-greeting" th:href="@{/mypage}" th:if="${userName != null}" th:text="|${userName}님|"></a>
        <form method="post" style="display:inline;" th:action="@{/admin/logout}">
            <button class="btn-landing-secondary" type="submit">로그아웃</button>
        </form>
    </div>
</header>

<section class="landing-section">
    <div class="landing-section-head">
        <div class="landing-section-eyebrow">USER DIRECTORY</div>
        <h2>회원 조회</h2>
        <p>가입한 회원을 검색하고 상세 정보와 계정 상태를 확인하세요.</p>
    </div>

    <div class="auth-error" id="listError" style="display:none; margin-bottom: var(--sp-3);">
        <i class="ti ti-x"></i>
        <span id="listErrorText"></span>
    </div>

    <form class="filter-bar" id="filterForm" style="flex-wrap:wrap; gap: var(--sp-2);">
        <input class="form-control" id="fEmail" name="email" placeholder="이메일" style="max-width:220px;" type="text">
        <input class="form-control" id="fUserName" name="userName" placeholder="이름" style="max-width:180px;" type="text">
        <select class="form-select" id="fStatus" name="status" style="max-width:140px;">
            <option value="">전체 상태</option>
            <option value="ACTIVE">활성</option>
            <option value="SLEEP">휴면</option>
            <option value="BLOCK">정지</option>
            <option value="WITHDRAW">탈퇴</option>
        </select>
        <button class="btn-add-widget" type="submit">검색</button>
    </form>

    <div class="location-summary-list" id="userList" style="margin-top: var(--sp-4);"></div>

    <p class="grid-widget-empty py-5" id="emptyMsg" style="display:none;">조건에 맞는 회원이 없어요.</p>

    <nav class="list-pagination" id="pager" style="display:none;">
        <a class="btn-landing-secondary" href="#" id="pagerPrev">이전</a>
        <span id="pagerInfo"></span>
        <a class="btn-landing-secondary" href="#" id="pagerNext">다음</a>
    </nav>
</section>

<footer class="landing-footer">
    © InsightOn — AIOT 빌딩 통합 관제
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const PAGE_SIZE = 20;

    const STATUS_META = {
        ACTIVE:   { label: '활성', cls: 'success' },
        SLEEP:    { label: '휴면', cls: 'warning' },
        BLOCK:    { label: '정지', cls: 'danger' },
        WITHDRAW: { label: '탈퇴', cls: 'neutral' }
    };

    const els = {
        form:    document.getElementById('filterForm'),
        email:   document.getElementById('fEmail'),
        name:    document.getElementById('fUserName'),
        status:  document.getElementById('fStatus'),
        list:    document.getElementById('userList'),
        empty:   document.getElementById('emptyMsg'),
        pager:   document.getElementById('pager'),
        prev:    document.getElementById('pagerPrev'),
        next:    document.getElementById('pagerNext'),
        info:    document.getElementById('pagerInfo'),
        error:   document.getElementById('listError'),
        errorTx: document.getElementById('listErrorText')
    };

    const state = { email: '', userName: '', status: '', page: 0 };

    /* URL 쿼리 → 초기 상태 (새로고침/뒤로가기 시 검색조건 유지) */
    function readStateFromUrl() {
        const q = new URLSearchParams(location.search);
        state.email = q.get('email') || '';
        state.userName = q.get('userName') || '';
        state.status = q.get('status') || '';
        state.page = Math.max(0, parseInt(q.get('page') || '0', 10) || 0);
        els.email.value = state.email;
        els.name.value = state.userName;
        els.status.value = state.status;
    }

    function writeStateToUrl() {
        const q = new URLSearchParams();
        if (state.email) q.set('email', state.email);
        if (state.userName) q.set('userName', state.userName);
        if (state.status) q.set('status', state.status);
        if (state.page) q.set('page', state.page);
        const qs = q.toString();
        history.replaceState(null, '', qs ? `?${qs}` : location.pathname);
    }

    function showError(msg) {
        els.errorTx.textContent = msg;
        els.error.style.display = '';
    }

    function hideError() {
        els.error.style.display = 'none';
    }

    function badge(status) {
        const m = STATUS_META[status] || { label: status, cls: 'neutral' };
        return `<span class="status-badge ${m.cls}" style="margin-top:0;">${m.label}</span>`;
    }

    function formatDate(iso) {
        if (!iso) return '-';
        return iso.slice(0, 10);
    }

    function escapeHtml(s) {
        return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function renderRows(content) {
        els.list.innerHTML = content.map(u => {
            const initial = escapeHtml((u.userName || u.email || '?').charAt(0));
            return `
            <a class="location-summary-row" href="/admin/users/${u.userId}" style="text-decoration:none; color:inherit;">
                <div class="location-summary-name">
                    <span class="location-avatar">${initial}</span>
                    <div>
                        <div>${escapeHtml(u.userName)}</div>
                        <div style="color:var(--ink-faint); font-size:var(--fs-meta); margin-top:2px;">
                            ${escapeHtml(u.email)} · 가입 ${formatDate(u.createdAt)}
                        </div>
                    </div>
                </div>
                ${badge(u.status)}
            </a>`;
        }).join('');
    }

    function renderPager(pageData) {
        if (pageData.totalPages <= 1) {
            els.pager.style.display = 'none';
            return;
        }
        els.pager.style.display = '';
        els.info.textContent = `${pageData.number + 1} / ${pageData.totalPages}`;
        els.prev.style.visibility = pageData.first ? 'hidden' : 'visible';
        els.next.style.visibility = pageData.last ? 'hidden' : 'visible';
    }

    function load() {
        hideError();
        const q = new URLSearchParams({ page: state.page, size: PAGE_SIZE });
        if (state.email) q.set('email', state.email);
        if (state.userName) q.set('userName', state.userName);
        if (state.status) q.set('status', state.status);

        fetch(`/admin/api/users?${q.toString()}`, { headers: { 'Accept': 'application/json' } })
            .then(res => {
                if (!res.ok) throw new Error('status ' + res.status);
                return res.json();
            })
            .then(data => {
                const content = data.content || [];
                renderRows(content);
                els.empty.style.display = content.length ? 'none' : '';
                renderPager(data);
                writeStateToUrl();
            })
            .catch(() => {
                els.list.innerHTML = '';
                els.empty.style.display = 'none';
                els.pager.style.display = 'none';
                showError('회원 목록을 불러오지 못했어요. 잠시 후 다시 시도해주세요.');
            });
    }

    els.form.addEventListener('submit', e => {
        e.preventDefault();
        state.email = els.email.value.trim();
        state.userName = els.name.value.trim();
        state.status = els.status.value;
        state.page = 0;
        load();
    });

    els.prev.addEventListener('click', e => {
        e.preventDefault();
        if (state.page > 0) { state.page -= 1; load(); }
    });

    els.next.addEventListener('click', e => {
        e.preventDefault();
        state.page += 1;
        load();
    });

    readStateFromUrl();
    load();
</script>
</body>
</html>
