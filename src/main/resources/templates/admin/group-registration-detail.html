<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>그룹 신청 상세 — InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="landing-page">

<header class="landing-header">
    <a class="brand" th:href="@{/admin/main}">
        <i class="ti ti-shield-lock"></i>InsightOn
    </a>
    <nav class="landing-nav">
        <a th:href="@{/admin/users}">회원 조회</a>
        <a class="active" th:href="@{/admin/group-registrations}">그룹 신청 관리</a>
        <a th:href="@{/admin/groups}">그룹 목록</a>
    </nav>
    <div class="landing-header-actions">
        <a class="landing-greeting" th:href="@{/mypage}" th:if="${userName != null}" th:text="|${userName}님|"></a>
        <form method="post" style="display:inline;" th:action="@{/admin/logout}">
            <button class="btn-landing-secondary" type="submit">로그아웃</button>
        </form>
    </div>
</header>

<section class="landing-section">
    <div class="mb-4">
        <a th:href="@{/admin/group-registrations}" class="btn-landing-secondary btn-sm" style="text-decoration:none;">
            <i class="ti ti-arrow-left"></i> 목록으로 돌아가기
        </a>
    </div>

    <div class="landing-section-head text-start">
        <div class="landing-section-eyebrow">REGISTRATION DETAIL #<span th:text="${registration.groupRegistrationId()}"></span></div>
        <h2 th:text="${registration.groupName()}"></h2>
        <p th:text="'신청일: ' + ${#temporals.format(registration.createdAt(), 'yyyy-MM-dd HH:mm:ss')}"></p>
    </div>

    <div class="form-panel form-panel-wide mt-4" style="max-width: 760px; margin: 0 auto; background: var(--bg-surface); padding: 2rem; border-radius: 12px; border: 1px solid var(--border-color, #e5e7eb);">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
            <div>
                <span class="text-muted small">처리 상태</span>
                <div class="mt-1">
                    <span class="status-badge" th:classappend="${registration.status().badgeClass}" th:text="${registration.status().label}"></span>
                </div>
            </div>
            <div class="text-end" th:if="${registration.status().name() == 'PENDING'}">
                <form method="post" style="display:inline;" th:action="@{/admin/group-registrations/{id}/approve(id=${registration.groupRegistrationId()})}">
                    <button class="btn btn-success me-2" type="submit"><i class="ti ti-check"></i> 신청 승인</button>
                </form>
                <form method="post" style="display:inline;" th:action="@{/admin/group-registrations/{id}/reject(id=${registration.groupRegistrationId()})}">
                    <button class="btn btn-outline-danger" type="submit"><i class="ti ti-x"></i> 신청 거절</button>
                </form>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <label class="form-label text-muted small mb-1">그룹명</label>
                <div class="fw-bold fs-5" th:text="${registration.groupName()}"></div>
            </div>

            <div class="col-md-6">
                <label class="form-label text-muted small mb-1">신청 지역 (Region)</label>
                <div class="fw-bold fs-5" th:text="${registration.groupRegion()}"></div>
            </div>

            <div class="col-12 mt-3">
                <label class="form-label text-muted small mb-1">그룹 상세 설명 (Description)</label>
                <div class="p-3 bg-light rounded" style="white-space: pre-wrap; font-size: 0.95rem; min-height: 80px;" th:text="${registration.description() != null and !#strings.isEmpty(registration.description()) ? registration.description() : '등록된 그룹 설명이 없습니다.'}"></div>
            </div>

            <div class="col-md-6 mt-4">
                <label class="form-label text-muted small mb-1">신청 회원 ID (Requester ID)</label>
                <div class="fw-semibold" th:text="${registration.requesterId()}"></div>
            </div>

            <div class="col-md-6 mt-4" th:if="${registration.approverId() != null}">
                <label class="form-label text-muted small mb-1">처리 관리자 ID (Approver ID)</label>
                <div class="fw-semibold" th:text="${registration.approverId()}"></div>
            </div>

            <div class="col-md-6 mt-3" th:if="${registration.approvedAt() != null}">
                <label class="form-label text-muted small mb-1">처리 일시</label>
                <div class="fw-semibold" th:text="${#temporals.format(registration.approvedAt(), 'yyyy-MM-dd HH:mm:ss')}"></div>
            </div>
        </div>
    </div>
</section>

<footer class="landing-footer mt-5">
    © InsightOn — AIOT 빌딩 통합 관제
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
