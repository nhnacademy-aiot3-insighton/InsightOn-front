<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>멤버 목록 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script th:src="@{/js/theme.js}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: manageSidebar('members')}"></aside>

    <main class="app-main">

        <div class="section-header">
            <p class="section-label mb-0">
                그룹 멤버
                <span class="num" style="color: var(--ink-faint); font-size: var(--fs-meta); margin-left: var(--sp-2);"
                      th:text="${groupMemberList != null ? groupMemberList.size() + '명' : ''}"></span>
            </p>
        </div>

        <!-- 멤버 목록 -->
        <div class="location-summary-list"
             th:if="${groupMemberList != null and not #lists.isEmpty(groupMemberList)}">

            <a th:each="member : ${groupMemberList}"
               th:href="@{/my-group/members/{id}(id=${member.groupMemberId()})}"
               class="location-summary-row">

                <!-- 아바타 + userName -->
                <div class="location-summary-name">
                    <span class="location-avatar"
                          th:text="${member.userName() != null and not #strings.isEmpty(member.userName()) ? #strings.substring(member.userName(), 0, 1) : 'M'}">
                        M
                    </span>
                    <span th:text="${member.userName() != null and not #strings.isEmpty(member.userName()) ? member.userName() : '멤버'}">사용자</span>
                </div>

                <!-- 역할 뱃지 -->
                <div class="location-summary-stat">
                    <span class="status-badge success"
                          style="margin-top:0;"
                          th:if="${member.groupRole().name() == 'SUPER_MANAGER'}">
                        <i class="ti ti-crown"></i> 최고관리자
                    </span>
                    <span class="status-badge neutral"
                          style="margin-top:0;"
                          th:if="${member.groupRole().name() == 'MANAGER'}">
                        <i class="ti ti-shield-check"></i> 매니저
                    </span>
                    <span class="status-badge"
                          style="margin-top:0; background: var(--surface-alt); color: var(--ink-soft); border: 1px solid var(--line);"
                          th:if="${member.groupRole().name() == 'MEMBER'}">
                        <i class="ti ti-user"></i> 멤버
                    </span>
                </div>

                <i class="ti ti-chevron-right" style="margin-left: auto; color: var(--ink-faint);"></i>
            </a>
        </div>

        <!-- 빈 상태 -->
        <p class="grid-widget-empty py-5"
           th:if="${groupMemberList != null and #lists.isEmpty(groupMemberList)}">
            등록된 멤버가 없어요.
        </p>
        <p class="split-detail-empty"
           th:if="${groupMemberList == null}">
            멤버 목록을 불러오지 못했어요.
        </p>

    </main>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/chat-widget.js}"></script>
</body>
</html>
