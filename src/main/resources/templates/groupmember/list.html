<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>멤버 목록 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: manageSidebar('members')}"></aside>

    <main class="app-main">

        <div class="d-flex align-items-center justify-content-between mb-3">
            <p class="section-label mb-0">
                그룹 멤버
                <span class="num" style="color: var(--ink-faint); font-size: var(--fs-meta); margin-left: var(--sp-2);"
                      th:text="${groupMemberList != null ? groupMemberList.size() + '명' : ''}"></span>
            </p>
            <button type="button" class="btn-landing-primary" data-bs-toggle="modal" data-bs-target="#inviteMemberModal" style="padding: var(--sp-2) var(--sp-3); font-size: var(--fs-body);" th:if="${isManager}">
                <i class="ti ti-user-plus"></i>멤버 초대
            </button>
        </div>

        <p th:if="${inviteSuccess}" th:text="${inviteSuccess}" class="form-text" style="color: #00b894; margin-bottom: var(--sp-2); font-weight: 500;"></p>

        <!-- 멤버 목록 -->
        <div class="location-summary-list"
             th:if="${groupMemberList != null and not #lists.isEmpty(groupMemberList)}">

            <a th:each="member : ${groupMemberList}"
               th:href="@{/my-group/members/{id}(id=${member.groupMemberId()})}"
               class="location-summary-row">

                <!-- 아바타 + userName -->
                <div class="location-summary-name">
                    <span class="location-avatar"
                          th:text="${member.userName() != null and not #strings.isEmpty(member.userName()) ? #strings.substring(member.userName(), 0, 1) : 'M'}">
                        M
                    </span>
                    <span th:text="${member.userName() != null and not #strings.isEmpty(member.userName()) ? member.userName() : '멤버'}">사용자</span>
                </div>

                <!-- 역할 뱃지 -->
                <div class="location-summary-stat">
                    <span class="status-badge success"
                          style="margin-top:0;"
                          th:if="${member.groupRole().name() == 'SUPER_MANAGER'}">
                        <i class="ti ti-crown"></i> 최고관리자
                    </span>
                    <span class="status-badge neutral"
                          style="margin-top:0;"
                          th:if="${member.groupRole().name() == 'MANAGER'}">
                        <i class="ti ti-shield-check"></i> 매니저
                    </span>
                    <span class="status-badge"
                          style="margin-top:0; background: var(--surface-alt); color: var(--ink-soft); border: 1px solid var(--line);"
                          th:if="${member.groupRole().name() == 'MEMBER'}">
                        <i class="ti ti-user"></i> 멤버
                    </span>
                </div>

                <i class="ti ti-chevron-right" style="margin-left: auto; color: var(--ink-faint);"></i>
            </a>
        </div>

        <!-- 권한 없음 안내 -->
        <div class="py-5 text-center" th:if="${permissionError != null}">
            <i class="ti ti-shield-lock d-block mb-2" style="font-size: 2.5rem; color: var(--ink-faint);"></i>
            <p style="color: var(--ink-soft); font-size: 1rem; font-weight: 500;" th:text="${permissionError}">
                멤버 목록을 볼 수 있는 권한이 없습니다.
            </p>
        </div>

        <!-- 기타 실패 및 빈 상태 -->
        <p class="grid-widget-empty py-5"
           th:if="${permissionError == null and groupMemberList != null and #lists.isEmpty(groupMemberList)}">
            등록된 멤버가 없어요.
        </p>
        <p class="split-detail-empty"
           th:if="${permissionError == null and groupMemberList == null}">
            멤버 목록을 불러오지 못했어요.
        </p>

    </main>
</div>

<!-- 멤버 초대 모달 팝업 -->
<div class="modal fade" id="inviteMemberModal" tabindex="-1" aria-labelledby="inviteMemberModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: var(--radius-lg); border: 1px solid var(--line); box-shadow: var(--shadow-lg);">
            <div class="modal-header" style="border-bottom: 1px solid var(--line); padding: var(--sp-4);">
                <h5 class="modal-title font-weight-bold" id="inviteMemberModalLabel" style="font-size: 1.1rem; color: var(--ink);">그룹 멤버 초대</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/my-group/members/invite}" method="post">
                <div class="modal-body" style="padding: var(--sp-4);">
                    <!-- 가입되지 않은 이메일 / 초대 실패 팝업 내부 에러 경고창 -->
                    <div th:if="${inviteError}" class="alert alert-danger d-flex align-items-center gap-2 mb-3" style="border-radius: var(--radius-md); font-size: 0.9rem; padding: 10px 14px;">
                        <i class="ti ti-alert-circle fs-5"></i>
                        <span th:text="${inviteError}">가입되지 않은 이메일이거나 초대에 실패했습니다.</span>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label" style="font-weight: 500; color: var(--ink);">초대할 회원 이메일</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="예: user@insighton.io" required style="border-radius: var(--radius-md);">
                        <p class="form-text mt-2" style="font-size: 0.85rem; color: var(--ink-soft);">
                            입력하신 이메일의 가입자 정보를 찾아 그룹 멤버로 즉시 추가합니다.
                        </p>
                    </div>
                </div>
                <div class="modal-footer" style="border-top: 1px solid var(--line); padding: var(--sp-3) var(--sp-4);">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn-landing-primary">
                        <i class="ti ti-user-plus"></i>추가하기
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/chat-widget.js}"></script>
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function() {
        const inviteSuccessMsg = /*[[${inviteSuccess}]]*/ null;
        const inviteErrorMsg = /*[[${inviteError}]]*/ null;

        if (inviteSuccessMsg) {
            alert(inviteSuccessMsg);
        } else if (inviteErrorMsg) {
            alert(inviteErrorMsg);
            const modalEl = document.getElementById('inviteMemberModal');
            if (modalEl) {
                const modal = new bootstrap.Modal(modalEl);
                modal.show();
            }
        }
    });
</script>
</body>
</html>
