<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="${groupMember != null ? groupMember.userName() + ' - InsightOn' : '멤버 상세 - InsightOn'}">멤버 상세 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link rel="icon" href="/img/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: manageSidebar('members')}"></aside>

    <main class="app-main" th:if="${groupMember != null}">

        <!-- 뒤로가기 -->
        <div style="margin-bottom: var(--sp-4);">
            <a class="d-inline-flex align-items-center gap-1"
               style="color: var(--ink-soft); text-decoration: none; font-size: var(--fs-body);"
               th:href="@{/my-group/members}">
                <i class="ti ti-arrow-left"></i>
                멤버 목록으로
            </a>
        </div>

        <!-- 멤버 프로필 카드 -->
        <div class="settings-card" style="display: flex; align-items: center; gap: var(--sp-4); margin-bottom: var(--sp-4);">
            <div class="location-avatar"
                 style="width: 48px; height: 48px; font-size: 1.25rem; flex-shrink: 0;"
                 th:text="${#strings.substring(groupMember.userName(), 0, 1)}">
                ?
            </div>
            <div style="flex: 1; min-width: 0;">
                <div style="font-size: 1rem; font-weight: 600; color: var(--ink);" th:text="${groupMember.userName()}">이름</div>
                <div style="margin-top: var(--sp-1);">
                    <span class="status-badge success" style="margin-top:0;"
                          th:if="${groupMember.groupRole().name() == 'SUPER_MANAGER'}">
                        <i class="ti ti-crown"></i> 최고관리자
                    </span>
                    <span class="status-badge neutral" style="margin-top:0;"
                          th:if="${groupMember.groupRole().name() == 'MANAGER'}">
                        <i class="ti ti-shield-check"></i> 매니저
                    </span>
                    <span class="status-badge"
                          style="margin-top:0; background: var(--surface-alt); color: var(--ink-soft); border: 1px solid var(--line);"
                          th:if="${groupMember.groupRole().name() == 'MEMBER'}">
                        <i class="ti ti-user"></i> 멤버
                    </span>
                </div>
            </div>
        </div>

        <!-- 멤버 상세 정보 -->
        <p class="section-label">멤버 정보</p>
        <div class="settings-card">

            <div class="settings-field">
                <label>이름</label>
                <input class="form-control" disabled th:value="${groupMember.userName()}" type="text">
            </div>

            <div class="settings-field">
                <label>연락처</label>
                <input class="form-control" disabled
                       th:value="${groupMember.userPhoneNumber() != null ? groupMember.userPhoneNumber() : '-'}"
                       type="text">
            </div>


            <div class="settings-field">
                <label>역할</label>
                <input class="form-control" disabled
                       th:value="${groupMember.groupRole().name() == 'SUPER_MANAGER' ? '최고관리자' :
                                   groupMember.groupRole().name() == 'MANAGER' ? '매니저' : '멤버'}" type="text">
            </div>

            <div class="settings-field">
                <label>가입일</label>
                <input class="form-control" disabled
                       th:value="${groupMember.joinedAt() != null ? #temporals.format(groupMember.joinedAt(), 'yyyy-MM-dd') : '-'}"
                       type="text">
            </div>

        </div>

        <!-- 관리 액션 (SUPER_MANAGER가 아닌 경우에만 표시) -->
        <div th:if="${groupMember.groupRole().name() != 'SUPER_MANAGER'}">
            <p class="section-label" style="margin-top: var(--sp-6);">멤버 관리</p>
            <div class="settings-card">

                <!-- 에러 메시지 영역 -->
                <div class="field-hint danger" id="actionError" style="display:none; margin-bottom: var(--sp-4);"></div>

                <!-- 매니저 권한 토글 -->
                <div class="settings-field" style="flex-direction: row; align-items: center; justify-content: space-between; gap: var(--sp-4);">
                    <div>
                        <div style="font-weight: 500;"
                             th:text="${groupMember.groupRole().name() == 'MANAGER' ? '매니저 권한 해제' : '매니저 권한 부여'}">
                            매니저 권한
                        </div>
                        <div class="field-hint" style="margin-top: var(--sp-1);"
                             th:text="${groupMember.groupRole().name() == 'MANAGER' ?
                                       '이 멤버의 매니저 권한을 해제합니다.' :
                                       '이 멤버에게 매니저 권한을 부여합니다.'}">
                            설명
                        </div>
                    </div>
                    <button class="btn btn-outline-secondary" id="btnToggleManager"
                            th:attr="data-member-id=${groupMember.groupMemberId()}"
                            type="button">
                        <i class="ti ti-shield-check"></i>
                        <span th:text="${groupMember.groupRole().name() == 'MANAGER' ? '권한 해제' : '권한 부여'}">권한 부여</span>
                    </button>
                </div>

                <!-- 최고관리자 권한 양도 (내가 SUPER_MANAGER이고, 대상 멤버가 MANAGER인 경우에만 표시) -->
                <div class="settings-field" style="flex-direction: row; align-items: center; justify-content: space-between; gap: var(--sp-4);"
                     th:if="${isSuperManager and groupMember.groupRole().name() == 'MANAGER'}">
                    <div>
                        <div style="font-weight: 500;">최고관리자 권한 양도</div>
                        <div class="field-hint" style="margin-top: var(--sp-1);">
                            이 멤버에게 최고관리자 권한을 양도합니다. 양도 후 내 권한은 매니저로 변경됩니다.
                        </div>
                    </div>
                    <button class="btn btn-outline-secondary" id="btnToggleSuperManager"
                            style="color: var(--warning); border-color: var(--warning);"
                            th:attr="data-member-id=${groupMember.groupMemberId()}"
                            type="button">
                        <i class="ti ti-crown"></i> 권한 양도
                    </button>
                </div>

                <!-- 멤버 내보내기 -->
                <div class="settings-field" style="flex-direction: row; align-items: center; justify-content: space-between; gap: var(--sp-4);">
                    <div>
                        <div style="font-weight: 500; color: var(--danger);">멤버 내보내기</div>
                        <div class="field-hint" style="margin-top: var(--sp-1);">이 멤버를 그룹에서 내보냅니다. 되돌릴 수 없어요.</div>
                    </div>
                    <button class="btn btn-outline-secondary text-danger" id="btnKick"
                            th:attr="data-member-id=${groupMember.groupMemberId()}"
                            type="button">
                        <i class="ti ti-user-minus"></i> 내보내기
                    </button>
                </div>

            </div>
        </div>

    </main>

    <!-- 데이터 없는 경우 -->
    <main class="app-main" th:if="${groupMember == null}">
        <p class="split-detail-empty">멤버 정보를 불러오지 못했어요.</p>
    </main>

</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/chat-widget.js}"></script>

<script th:inline="javascript">
    const CSRF_TOKEN  = /*[[${_csrf != null ? _csrf.token : ''}]]*/ '';
    const CSRF_HEADER = /*[[${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}]]*/ 'X-CSRF-TOKEN';

    function buildHeaders() {
        const h = { 'Content-Type': 'application/json' };
        if (CSRF_TOKEN) h[CSRF_HEADER] = CSRF_TOKEN;
        return h;
    }

    function showError(msg) {
        const el = document.getElementById('actionError');
        if (!el) return;
        el.textContent = msg;
        el.style.display = '';
    }

    /* 매니저 권한 토글 */
    const btnToggleManager = document.getElementById('btnToggleManager');
    if (btnToggleManager) {
        btnToggleManager.addEventListener('click', () => {
            const memberId = btnToggleManager.dataset.memberId;
            fetch(`/my-group/members/${memberId}/toggle-manager`, {
                method: 'PUT',
                headers: buildHeaders()
            }).then(res => {
                if (res.ok || res.redirected) {
                    location.href = `/my-group/members/${memberId}`;
                } else {
                    res.text().then(t => showError('권한 변경에 실패했어요: ' + t));
                }
            }).catch(() => showError('네트워크 오류가 발생했어요.'));
        });
    }

    /* 최고관리자 권한 양도 */
    const btnToggleSuperManager = document.getElementById('btnToggleSuperManager');
    if (btnToggleSuperManager) {
        btnToggleSuperManager.addEventListener('click', () => {
            if (!confirm('정말 최고관리자 권한을 이 멤버에게 양도하시겠어요?\n양도 후 내 권한은 매니저로 변경됩니다.')) return;
            const memberId = btnToggleSuperManager.dataset.memberId;
            fetch(`/my-group/members/${memberId}/toggle-super-manager`, {
                method: 'PUT',
                headers: buildHeaders()
            }).then(res => {
                if (res.ok || res.redirected) {
                    location.href = `/my-group/members/${memberId}`;
                } else {
                    res.text().then(t => showError('권한 양도에 실패했어요: ' + t));
                }
            }).catch(() => showError('네트워크 오류가 발생했어요.'));
        });
    }

    /* 멤버 내보내기 */
    const btnKick = document.getElementById('btnKick');
    if (btnKick) {
        btnKick.addEventListener('click', () => {
            if (!confirm('정말 이 멤버를 그룹에서 내보내시겠어요?')) return;
            const memberId = btnKick.dataset.memberId;
            fetch(`/my-group/members/${memberId}/kick`, {
                method: 'DELETE',
                headers: buildHeaders()
            }).then(res => {
                if (res.ok || res.redirected) {
                    location.href = '/my-group/members';
                } else {
                    res.text().then(t => showError('멤버 내보내기에 실패했어요: ' + t));
                }
            }).catch(() => showError('네트워크 오류가 발생했어요.'));
        });
    }
</script>
</body>
</html>
