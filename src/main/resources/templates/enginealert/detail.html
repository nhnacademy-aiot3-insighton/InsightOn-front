<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${alert.title()} + ' - InsightOn'">엔진알람 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="app-main">
        <p class="section-label">
            <a th:href="@{/my-group/engine-alerts}" style="color:var(--ink-soft); text-decoration:none;">
                <i class="ti ti-arrow-left"></i> 엔진알람
            </a>
        </p>

        <div id="detailContent" class="settings-card" style="max-width: 100%;">
            <div style="display:flex; align-items:center; gap: var(--sp-3); margin-bottom: var(--sp-2);">
                <span class="status-badge neutral" style="margin-top:0;" th:if="${alert.severity().name() == 'INFO'}">정보</span>
                <span class="status-badge warning" style="margin-top:0;" th:if="${alert.severity().name() == 'WARNING'}">경고</span>
                <span class="status-badge danger" style="margin-top:0;" th:if="${alert.severity().name() == 'CRITICAL'}">위험</span>
                <span class="field-hint" style="margin-top:0;" th:text="${alert.locationName()}"></span>
                <span class="field-hint" style="margin-top:0;" th:text="${#temporals.format(alert.createdAt().withOffsetSameInstant(T(java.time.ZoneOffset).ofHours(9)), 'yyyy-MM-dd HH:mm')}"></span>
            </div>
            <h2 style="font-size:1.25rem; font-weight:700; color:var(--ink); margin-bottom: var(--sp-3);" th:text="${alert.title()}"></h2>
            <div class="report-content" data-markdown style="margin-bottom: var(--sp-4);" th:text="${alert.message()}"></div>

            <div th:if="${alert.triggerValue() != null and not #maps.isEmpty(alert.triggerValue())}">
                <label style="display:block; font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--sp-2);">트리거 당시 값</label>
                <div class="gateway-status-meta" style="border-top:none; margin-top:0; padding-top:0;">
                    <div class="gateway-status-meta-row" th:each="entry : ${alert.triggerValue()}">
                        <span th:text="${entry.key}"></span>
                        <span class="gateway-status-meta-value" th:text="${entry.value}"></span>
                    </div>
                </div>
            </div>

            <p class="field-hint" th:if="${alert.flowId() != null}" style="margin-top: var(--sp-4);">
                <i class="ti ti-git-branch"></i> 이 알람을 발생시킨 Flow #<span th:text="${alert.flowId()}"></span>
            </p>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/chat-widget.js}"></script>
<script th:src="@{/js/markdown-render.js}"></script>
</body>
</html>
