<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>위치 관리 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="app-main">
        <p class="section-label">위치</p>
        <div class="location-summary-list" th:if="${locationList != null and not #lists.isEmpty(locationList)}">
            <a th:each="loc : ${locationList}"
               th:href="@{/my-group/location/{id}/dashboard(id=${loc.locationId()})}"
               class="location-summary-row">
                <div class="location-summary-name">
                    <span class="location-avatar" th:text="${#strings.substring(loc.locationName(), 0, 1)}">1</span>
                    <span th:text="${loc.locationName()}">위치명</span>
                </div>
                <span class="status-badge neutral" style="margin-top:0;" th:text="${loc.autoControlMode()}">MODE</span>
                <i class="ti ti-chevron-right"></i>
            </a>
        </div>
        <p class="grid-widget-empty py-5" th:if="${locationList == null or #lists.isEmpty(locationList)}">
            등록된 위치가 없어요.
        </p>

        <p class="section-label" style="margin-top: var(--sp-5);">위치 추가</p>
        <p th:if="${createError}" th:text="${createError}" class="form-text" style="color: var(--danger); margin-bottom: var(--sp-2);"></p>
        <form th:action="@{/my-group/location/create}" method="post" style="max-width: 420px; display: flex; flex-direction: column; gap: var(--sp-3);">
            <div>
                <label for="locationName" class="form-label">위치 이름</label>
                <input type="text" id="locationName" name="locationName" class="form-control" placeholder="예: 2층 사무실" required>
            </div>
            <div>
                <label for="autoControlMode" class="form-label">자동 제어 모드</label>
                <select id="autoControlMode" name="autoControlMode" class="form-control" required>
                    <option value="SUGGESTION">제안만 받기 (SUGGESTION)</option>
                    <option value="AI_DIRECT">AI 자동 제어 (AI_DIRECT)</option>
                </select>
            </div>
            <button type="submit" class="btn-landing-primary" style="align-self: flex-start;">
                <i class="ti ti-plus"></i>위치 추가
            </button>
        </form>
    </main>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
