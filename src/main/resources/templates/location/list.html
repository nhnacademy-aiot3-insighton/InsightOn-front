<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>위치 관리 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="app-main">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <p class="section-label mb-0">위치</p>
            <button type="button" class="btn-landing-primary" data-bs-toggle="modal" data-bs-target="#createLocationModal" style="padding: var(--sp-2) var(--sp-3); font-size: var(--fs-body);" th:if="${isManager}">
                <i class="ti ti-plus"></i>위치 추가
            </button>
        </div>

        <p th:if="${createError}" th:text="${createError}" class="form-text" style="color: var(--danger); margin-bottom: var(--sp-2);"></p>

        <div class="location-summary-list" th:if="${locationList != null and not #lists.isEmpty(locationList)}">
            <div th:each="loc : ${locationList}" class="location-summary-row">
                <a th:href="@{/my-group/location/{id}/dashboard(id=${loc.locationId()})}" class="location-summary-name" style="text-decoration:none; color:inherit;">
                    <span class="location-avatar" th:text="${#strings.substring(loc.locationName(), 0, 1)}">1</span>
                    <span th:text="${loc.locationName()}">위치명</span>
                </a>
                <div class="d-flex align-items-center gap-2">
                    <a th:href="@{/my-group/location/{id}(id=${loc.locationId()})}" class="btn-landing-secondary" style="padding: var(--sp-1) var(--sp-3); font-size: var(--fs-meta); text-decoration:none;">상세 보기</a>
                    <button type="button" class="btn-landing-secondary" style="padding: var(--sp-1) var(--sp-3); font-size: var(--fs-meta); color: var(--danger);"
                            th:if="${isManager}"
                            th:attr="data-loc-id=${loc.locationId()}, data-loc-name=${loc.locationName()}"
                            onclick="deleteLocationRow(this)">삭제</button>
                </div>
            </div>
        </div>
        <p class="grid-widget-empty py-5" th:if="${locationList == null or #lists.isEmpty(locationList)}">
            등록된 위치가 없어요.
        </p>
    </main>
</div>

<!-- 위치 추가 모달 팝업 -->
<div class="modal fade" id="createLocationModal" tabindex="-1" aria-labelledby="createLocationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="createLocationModalLabel">새 위치 추가</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/my-group/location/create}" method="post">
                <div class="modal-body">
                    <div class="settings-field">
                        <label for="locationName">위치 이름</label>
                        <input type="text" id="locationName" name="locationName" class="form-control" placeholder="예: 2층 사무실, B동 로비" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn-landing-primary">
                        <i class="ti ti-plus"></i>추가하기
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function deleteLocationRow(btn) {
        var id = btn.getAttribute('data-loc-id');
        var name = btn.getAttribute('data-loc-name') || '이 위치';
        if (!id) return;
        if (!confirm('"' + name + '" 위치를 삭제할까요? 관련 대시보드·위젯도 함께 삭제됩니다.')) return;
        btn.disabled = true;
        fetch('/my-group/location/' + id + '/delete', { method: 'DELETE' })
            .then(function (res) {
                if (res.ok) {
                    window.location.reload();
                } else {
                    alert('위치 삭제에 실패했어요. 잠시 후 다시 시도해주세요.');
                    btn.disabled = false;
                }
            })
            .catch(function () {
                alert('위치 삭제 중 오류가 발생했어요.');
                btn.disabled = false;
            });
    }

    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('openModal') === 'true') {
            const modalEl = document.getElementById('createLocationModal');
            if (modalEl) {
                const modal = new bootstrap.Modal(modalEl);
                modal.show();
            }
        }

        const sidebarAddBtn = document.getElementById('sidebarAddLocationBtn');
        if (sidebarAddBtn) {
            sidebarAddBtn.addEventListener('click', function(e) {
                if (window.location.pathname === '/my-group/location/list') {
                    e.preventDefault();
                    const modalEl = document.getElementById('createLocationModal');
                    if (modalEl) {
                        const modal = new bootstrap.Modal(modalEl);
                        modal.show();
                    }
                }
            });
        }
    });
</script>
</body>
</html>
