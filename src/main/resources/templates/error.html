<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오류 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body th:with="isNotFound=${status == 404}, isForbidden=${status == 403}, isDownstream=${status != null and status >= 500}">

<header class="landing-header">
    <a th:href="@{/}" class="brand">
        <i class="ti ti-chart-line"></i>InsightOn
    </a>
</header>

<div class="flow-detail-main" style="padding: var(--sp-8) var(--sp-4);">
    <div class="flow-detail-card" style="max-width: 480px; margin: 0 auto;">
        <div class="flow-error-state">
            <span class="flow-error-icon warning" th:if="${isForbidden}"><i class="ti ti-lock"></i></span>
            <span class="flow-error-icon neutral" th:if="${isNotFound}"><i class="ti ti-search"></i></span>
            <span class="flow-error-icon danger" th:if="${isDownstream}"><i class="ti ti-plug-off"></i></span>
            <span class="flow-error-icon warning" th:if="${!isForbidden and !isNotFound and !isDownstream}"><i class="ti ti-alert-triangle"></i></span>

            <h2 th:if="${isForbidden}">권한이 없어요</h2>
            <h2 th:if="${isNotFound}">페이지를 찾을 수 없어요</h2>
            <h2 th:if="${isDownstream}">일시적으로 서비스를 이용할 수 없어요</h2>
            <h2 th:if="${!isForbidden and !isNotFound and !isDownstream}">요청을 처리하지 못했어요</h2>

            <p th:if="${isNotFound}">주소가 바뀌었거나 삭제된 페이지예요. 주소를 다시 확인해주세요.</p>
            <p th:if="${isForbidden}">이 페이지에 접근할 권한이 없어요.</p>
            <p th:if="${isDownstream}">잠시 후 다시 시도해주세요. 계속되면 관리자에게 문의해주세요.</p>
            <p th:if="${!isForbidden and !isNotFound and !isDownstream}">알 수 없는 문제가 발생했어요. 잠시 후 다시 시도해주세요.</p>

            <p class="flow-error-code" th:if="${status != null}" th:text="'오류 코드 ' + ${status}"></p>
            <div class="flow-error-actions">
                <a th:href="@{/}" class="btn btn-primary">홈으로</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
