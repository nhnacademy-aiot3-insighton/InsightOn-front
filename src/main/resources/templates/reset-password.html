<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>새 비밀번호 설정 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header class="landing-header">
    <a th:href="@{/}" class="brand">
        <i class="ti ti-chart-line"></i>
        InsightOn
    </a>
</header>

<main class="auth-main">
    <div class="auth-card">

        <!-- 완료 화면 -->
        <div th:if="${done}">
            <h1>비밀번호를 바꿨어요</h1>
            <p class="auth-subtitle">새 비밀번호로 다시 로그인해주세요.</p>
            <a th:href="@{/login}" class="btn-landing-primary w-100 justify-content-center">
                로그인하러 가기<i class="ti ti-arrow-right"></i>
            </a>
        </div>

        <!-- 입력 화면 -->
        <div th:unless="${done}">
            <h1>새 비밀번호 설정</h1>
            <p class="auth-subtitle">계정에 사용할 새 비밀번호를 입력하세요.</p>

            <!-- 토큰 없음/만료 안내 -->
            <div class="auth-error" th:if="${token == null or token.isEmpty()}">
                <i class="ti ti-alert-circle"></i>
                <span>유효하지 않은 접근이에요. 재설정 링크를 다시 요청해주세요.</span>
            </div>

            <!-- 서버가 내려주는 에러 메시지 (링크 만료 등) -->
            <div class="auth-error" th:if="${resetError}">
                <i class="ti ti-alert-circle"></i>
                <span th:text="${resetError}"></span>
            </div>

            <form th:action="@{/password/reset-confirm}" method="post"
                  th:if="${token != null and !token.isEmpty()}"
                  id="resetConfirmForm">
                <input type="hidden" name="token" th:value="${token}">

                <div class="settings-field">
                    <label for="password">새 비밀번호</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="8자 이상" minlength="8" required autofocus>
                        <button type="button" class="password-toggle" data-target="password"
                                aria-label="비밀번호 표시"><i class="ti ti-eye"></i></button>
                    </div>
                </div>

                <div class="settings-field">
                    <label for="passwordConfirm">새 비밀번호 확인</label>
                    <div class="password-field">
                        <input type="password" id="passwordConfirm" class="form-control"
                               placeholder="다시 입력해주세요" minlength="8" required>
                        <button type="button" class="password-toggle" data-target="passwordConfirm"
                                aria-label="비밀번호 표시"><i class="ti ti-eye"></i></button>
                    </div>
                    <small class="settings-hint" id="pwMismatch" style="display:none; color:var(--danger, #c0392b);">
                        두 비밀번호가 일치하지 않아요.
                    </small>
                </div>

                <button type="submit" class="btn-landing-primary w-100 justify-content-center">
                    비밀번호 바꾸기<i class="ti ti-arrow-right"></i>
                </button>
            </form>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/reset-password.js}"></script>
</body>
</html>
