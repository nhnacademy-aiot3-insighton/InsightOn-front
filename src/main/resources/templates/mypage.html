<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내 정보 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header class="landing-header">
    <a th:href="${groupId != null} ? @{/my-group} : @{/}" class="brand">
        <span th:replace="~{fragments/layout :: brandMark}"></span>InsightOn
    </a>
    <div class="landing-header-actions" style="margin-left:auto;">
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn-landing-secondary">로그아웃</button>
        </form>
    </div>
</header>

<main class="form-page">
    <div class="form-panel form-panel-wide">

        <div class="form-panel-head">
            <span class="form-medallion"><i class="ti ti-user"></i></span>
            <div>
                <h1>내 정보</h1>
                <p>계정 정보와 화면 설정을 여기서 관리해요.</p>
            </div>
        </div>

        <!-- 프로필 -->
        <div class="form-section is-flush">
            <div class="form-section-label"><i class="ti ti-id-badge-2"></i>프로필</div>
            <div class="settings-field">
                <label>이메일</label>
                <input type="email" class="form-control" th:value="${email}" disabled>
            </div>
            <div class="settings-field">
                <label>이름</label>
                <input type="text" class="form-control" th:value="${name}" disabled>
            </div>
            <div class="settings-field">
                <label>연락처</label>
                <input type="tel" class="form-control" th:value="${phone}" disabled>
            </div>
            <div class="settings-field">
                <label>그룹</label>
                <input type="text" class="form-control" th:value="${groupName}" disabled>
            </div>
            <div class="form-actions">
                <a th:href="@{/mypage/password}" class="btn-landing-secondary">비밀번호 재설정</a>
                <span class="spacer"></span>
                <a th:href="@{/mypage/edit}" class="btn-landing-primary">내 정보 수정</a>
            </div>
        </div>

        <hr class="coral-rule">

        <!-- 화면 모드 -->
        <div class="form-section is-flush">
            <div class="form-section-label"><i class="ti ti-brightness"></i>화면 모드</div>
            <p class="field-hint" style="margin-bottom: var(--sp-3);">라이트 / 다크 테마를 선택하세요. '시스템'은 기기 설정을 따릅니다.</p>
            <div class="type-choice-group" id="themeChoiceGroup">
                <label class="type-choice">
                    <input type="radio" name="themePref" value="system">
                    <i class="ti ti-device-desktop"></i>시스템
                </label>
                <label class="type-choice">
                    <input type="radio" name="themePref" value="light">
                    <i class="ti ti-sun"></i>라이트
                </label>
                <label class="type-choice">
                    <input type="radio" name="themePref" value="dark">
                    <i class="ti ti-moon"></i>다크
                </label>
            </div>
        </div>

        <hr class="coral-rule">

        <!-- 연동된 소셜 계정 -->
        <div class="form-section is-flush">
            <div class="form-section-label"><i class="ti ti-link"></i>연동된 계정</div>
            <p id="socialError" class="field-hint danger" style="display:none;"></p>
            <p th:if="${param.linked}" class="field-hint">계정을 연동했어요.</p>
            <p th:if="${param.linkError}" class="field-hint danger"
               th:text="${param.linkError[0] == 'already'} ? '이미 연동된 계정이에요.'
                      : (${param.linkError[0] == 'other_account'} ? '다른 계정에 연동된 소셜 계정이에요.'
                      : '연동에 실패했어요. 잠시 후 다시 시도해주세요.')"></p>

            <div id="socialList">
                <div class="social-account-row" th:each="oauth : ${oauths}" th:data-oauth-id="${oauth.oauthId}">
                    <span class="social-icon">
                        <i th:class="${#strings.toLowerCase(oauth.provider) == 'google'} ? 'ti ti-brand-google' : 'ti ti-brand-github'"></i>
                    </span>
                    <div class="social-info">
                        <div class="social-name" th:text="${#strings.capitalize(#strings.toLowerCase(oauth.provider))}"></div>
                        <div class="social-meta">연동됨</div>
                    </div>
                    <button type="button" class="btn btn-outline-secondary btn-unlink"
                            th:data-oauth-id="${oauth.oauthId}">해제</button>
                </div>
            </div>

            <!-- 이미 연동된 provider 는 연동하기 버튼을 숨긴다 (linkedProviders 는 컨트롤러에서 소문자로 계산) -->
            <div class="oauth-list" style="margin-top: var(--sp-4);"
                 th:if="${linkedProviders == null or !linkedProviders.contains('google') or !linkedProviders.contains('github')}">
                <form th:action="@{/oauth/link/google}" method="get"
                      th:unless="${linkedProviders != null and linkedProviders.contains('google')}">
                    <button type="submit" class="btn-google">Google 계정 연동하기</button>
                </form>
                <form th:action="@{/oauth/link/github}" method="get"
                      th:unless="${linkedProviders != null and linkedProviders.contains('github')}">
                    <button type="submit" class="btn-google">GitHub 계정 연동하기</button>
                </form>
            </div>
        </div>

        <hr class="coral-rule">

        <!-- 회원 탈퇴 -->
        <div class="form-section is-flush">
            <div class="form-section-label"><i class="ti ti-alert-triangle"></i>회원 탈퇴</div>
            <p class="field-hint">탈퇴하면 계정 정보가 삭제되고 되돌릴 수 없어요.</p>
            <div class="form-actions">
                <span class="spacer"></span>
                <button type="button" id="btnWithdraw" class="btn btn-outline-secondary" style="color: var(--danger); border-color: rgba(184,57,47,0.4);">탈퇴하기</button>
            </div>
        </div>

    </div>
</main>

<script th:src="@{/js/mypage/mypage.js}"></script>
<script>
    (function () {
        var group = document.getElementById('themeChoiceGroup');
        if (!group || !window.InsightTheme) return;
        var current = window.InsightTheme.getPref();
        var input = group.querySelector('input[value="' + current + '"]');
        if (input) input.checked = true;
        group.addEventListener('change', function (e) {
            if (e.target && e.target.name === 'themePref') {
                window.InsightTheme.set(e.target.value);
            }
        });
    })();
</script>
</body>
</html>
