<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내 정보 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script th:src="@{/js/theme.js}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header class="landing-header">
    <a th:href="@{/}" class="brand">
        <i class="ti ti-chart-line"></i>InsightOn
    </a>
    <div class="landing-header-actions" style="margin-left:auto;">
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn-landing-secondary">로그아웃</button>
        </form>
    </div>
</header>

<div class="account-shell">

    <div class="account-header">
        <h1>My Page</h1>
    </div>

    <section class="account-section">
        <div class="settings-card">

            <div class="settings-field">
                <label>Email</label>
                <input type="email" class="form-control" th:value="${email}" disabled>
            </div>

            <div class="settings-field">
                <label>Name</label>
                <input type="text" class="form-control" th:value="${name}" disabled>
            </div>

            <div class="settings-field">
                <label>PhoneNumber</label>
                <input type="tel" class="form-control" th:value="${phone}" disabled>
            </div>

            <div class="settings-field">
                <label>Group Name</label>
                <input type="text" class="form-control" th:value="${groupName}" disabled>
            </div>

            <div class="settings-actions" style="display:flex; gap: var(--sp-3);">
                <a th:href="@{/mypage/password}" class="btn-landing-secondary" style="flex:1; text-align:center;">비밀번호 재설정</a>
                <a th:href="@{/mypage/edit}" class="btn-landing-primary" style="flex:1; text-align:center;">내 정보 수정</a>
            </div>
        </div>
    </section>

    <!-- 화면 모드 (다크/라이트) -->
    <section class="account-section">
        <div class="settings-card">
            <h2 style="font-size:1rem; font-weight:600; margin-bottom: var(--sp-4);">화면 모드</h2>
            <p class="field-hint" style="margin-bottom: var(--sp-3);">라이트 / 다크 테마를 선택하세요. '시스템'은 기기 설정을 따릅니다.</p>
            <div class="type-choice-group" id="themeChoiceGroup">
                <label class="type-choice">
                    <input type="radio" name="themePref" value="system">
                    <i class="ti ti-device-desktop"></i>시스템
                </label>
                <label class="type-choice">
                    <input type="radio" name="themePref" value="light">
                    <i class="ti ti-sun"></i>라이트
                </label>
                <label class="type-choice">
                    <input type="radio" name="themePref" value="dark">
                    <i class="ti ti-moon"></i>다크
                </label>
            </div>
        </div>
    </section>

    <!-- 연동된 소셜 계정 -->
    <section class="account-section">
        <div class="settings-card">
            <h2 style="font-size:1rem; font-weight:600; margin-bottom: var(--sp-4);">연동된 계정</h2>
            <p id="socialError" class="field-hint danger" style="display:none;"></p>

            <div id="socialList">
                <div class="social-account-row" th:each="oauth : ${oauths}" th:data-oauth-id="${oauth.oauthId}">
                    <span class="social-icon">
                        <i th:class="${oauth.provider == 'GOOGLE'} ? 'ti ti-brand-google' : 'ti ti-brand-github'"></i>
                    </span>
                    <div class="social-info">
                        <div class="social-name" th:text="${oauth.provider}"></div>
                        <div class="social-meta">연동됨</div>
                    </div>
                    <button type="button" class="btn btn-outline-secondary btn-unlink"
                            th:data-oauth-id="${oauth.oauthId}">해제</button>
                </div>
            </div>

            <div class="oauth-list" style="margin-top: var(--sp-4);">
                <form th:action="@{/login/google}" method="post">
                    <button type="submit" class="btn-google">Google 계정 연동하기</button>
                </form>
                <form th:action="@{/login/github}" method="post">
                    <button type="submit" class="btn-google">GitHub 계정 연동하기</button>
                </form>
            </div>
        </div>
    </section>

    <!-- 회원 탈퇴 -->
    <section class="account-section">
        <div class="settings-card">
            <p class="field-hint">탈퇴하면 계정 정보가 삭제되고 되돌릴 수 없어요.</p>
            <div class="settings-actions">
                <button type="button" id="btnWithdraw" class="btn btn-outline-secondary" style="color: var(--danger); border-color: rgba(184,57,47,0.4);">탈퇴하기</button>
            </div>
        </div>
    </section>

</div>

<script th:src="@{/js/mypage/mypage.js}"></script>
<script>
    (function () {
        var group = document.getElementById('themeChoiceGroup');
        if (!group || !window.InsightTheme) return;
        var current = window.InsightTheme.getPref();
        var input = group.querySelector('input[value="' + current + '"]');
        if (input) input.checked = true;
        group.addEventListener('change', function (e) {
            if (e.target && e.target.name === 'themePref') {
                window.InsightTheme.set(e.target.value);
            }
        });
    })();
</script>
</body>
</html>
