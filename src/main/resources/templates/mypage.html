<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내 정보 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header class="landing-header">
    <a th:href="@{/}" class="brand">
        <i class="ti ti-chart-line"></i>
        InsightOn
    </a>
    <div class="landing-header-actions">
        <a th:href="@{/my-group}" class="btn-landing-secondary">대시보드로</a>
    </div>
</header>

<div class="account-shell">
    <div class="account-header">
        <h1>내 정보</h1>
        <p>계정 정보, 비밀번호, 연동된 소셜 계정을 관리해요.</p>
    </div>

    <!-- 정보 조회 / 수정 -->
    <div class="account-section">
        <p class="account-section-title">기본 정보</p>
        <div class="settings-card">
            <form th:action="@{/mypage/update}" method="post">
                <div class="settings-field">
                    <label for="email">이메일</label>
                    <input type="email" id="email" class="form-control" th:value="${email}" disabled>
                    <p class="form-text">이메일은 바꿀 수 없어요.</p>
                </div>
                <div class="settings-field">
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" class="form-control" th:value="${name}" required>
                </div>
                <div class="settings-field">
                    <label for="phone">전화번호</label>
                    <input type="tel" id="phone" name="phone" class="form-control" th:value="${phone}" placeholder="010-1234-5678" required>
                </div>
                <div class="settings-actions">
                    <button type="submit" class="btn btn-primary">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 비밀번호 변경 -->
    <div class="account-section">
        <p class="account-section-title">비밀번호</p>
        <div class="settings-card">
            <div class="auth-error" th:if="${passwordError}">
                <i class="ti ti-alert-circle"></i>
                <span th:text="${passwordError}"></span>
            </div>
            <div class="auth-error" style="background:var(--success-tint); color:var(--success); border-color:rgba(47,125,92,0.25);" th:if="${passwordSuccess}">
                <i class="ti ti-check"></i>
                <span th:text="${passwordSuccess}"></span>
            </div>

            <div th:unless="${hasPassword}" class="field-hint">
                소셜 로그인 전용 계정이에요. 비밀번호를 바꾸려면 먼저 이메일·비밀번호를 연동하세요.
            </div>

            <form th:if="${hasPassword}" th:action="@{/mypage/password}" method="post">
                <div class="settings-field">
                    <label for="currentPassword">현재 비밀번호</label>
                    <div class="password-field">
                        <input type="password" id="currentPassword" name="currentPassword" class="form-control" required>
                        <button type="button" class="password-toggle" aria-label="비밀번호 표시"><i class="ti ti-eye"></i></button>
                    </div>
                </div>
                <div class="settings-field">
                    <label for="newPassword">새 비밀번호</label>
                    <div class="password-field">
                        <input type="password" id="newPassword" name="newPassword" class="form-control" minlength="8" required>
                        <button type="button" class="password-toggle" aria-label="비밀번호 표시"><i class="ti ti-eye"></i></button>
                    </div>
                </div>
                <div class="settings-actions">
                    <button type="submit" class="btn btn-primary">비밀번호 변경</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 소셜 계정 연동 / 해제 (== 연동 목록 조회 포함) -->
    <div class="account-section">
        <p class="account-section-title">연동된 소셜 계정</p>
        <div class="auth-error" th:if="${socialError}">
            <i class="ti ti-alert-circle"></i>
            <span th:text="${socialError}"></span>
        </div>
        <div class="location-summary-list">
            <div class="social-account-row">
                <span class="social-icon">
                    <svg width="16" height="16" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
                        <path fill="#34A853" d="M9 18c2.43 0 4.47-.81 5.96-2.18l-2.92-2.26c-.81.54-1.84.87-3.04.87-2.34 0-4.32-1.58-5.03-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
                        <path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/>
                        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
                    </svg>
                </span>
                <div class="social-info">
                    <div class="social-name">Google</div>
                    <div class="social-meta" th:text="${#lists.contains(linkedProviders, 'GOOGLE')} ? '연동됨' : '연동 안 됨'"></div>
                </div>
                <form th:if="${#lists.contains(linkedProviders, 'GOOGLE')}" th:action="@{/mypage/social/unlink}" method="post">
                    <input type="hidden" name="provider" value="GOOGLE">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">연동 해제</button>
                </form>
                <form th:unless="${#lists.contains(linkedProviders, 'GOOGLE')}" th:action="@{/mypage/social/link}" method="post">
                    <input type="hidden" name="provider" value="GOOGLE">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">연동하기</button>
                </form>
            </div>
            <div class="social-account-row">
                <span class="social-icon">
                    <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#181717" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                </span>
                <div class="social-info">
                    <div class="social-name">GitHub</div>
                    <div class="social-meta" th:text="${#lists.contains(linkedProviders, 'GITHUB')} ? '연동됨' : '연동 안 됨'"></div>
                </div>
                <form th:if="${#lists.contains(linkedProviders, 'GITHUB')}" th:action="@{/mypage/social/unlink}" method="post">
                    <input type="hidden" name="provider" value="GITHUB">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">연동 해제</button>
                </form>
                <form th:unless="${#lists.contains(linkedProviders, 'GITHUB')}" th:action="@{/mypage/social/link}" method="post">
                    <input type="hidden" name="provider" value="GITHUB">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">연동하기</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 권한 조회 -->
    <div class="account-section">
        <p class="account-section-title">권한</p>
        <div class="settings-card">
            <span class="status-badge success">일반 사용자</span>
        </div>
    </div>

</div>

<script th:src="@{/js/auth/signup.js}"></script>
</body>
</html>
