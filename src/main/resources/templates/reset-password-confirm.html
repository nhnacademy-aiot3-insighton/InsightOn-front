<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>새 비밀번호 설정 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header class="landing-header">
    <a th:href="@{/}" class="brand">
        <i class="ti ti-chart-line"></i>
        InsightOn
    </a>
</header>

<main class="auth-main">
    <div class="auth-card">

        <div th:if="${done}">
            <h1>비밀번호를 바꿨어요</h1>
            <p class="auth-subtitle">새 비밀번호로 다시 로그인해주세요.</p>
            <a th:href="@{/login}" class="btn-landing-primary w-100 justify-content-center">
                로그인하러 가기<i class="ti ti-arrow-right"></i>
            </a>
        </div>

        <div th:unless="${done}">
            <h1>새 비밀번호 설정</h1>
            <p class="auth-subtitle">계정에 사용할 새 비밀번호를 입력하세요.</p>

            <form th:action="@{/reset-password/confirm}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <div class="settings-field">
                    <label for="password">새 비밀번호</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" class="form-control" placeholder="8자 이상" minlength="8" required autofocus>
                        <button type="button" class="password-toggle" aria-label="비밀번호 표시"><i class="ti ti-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="btn-landing-primary w-100 justify-content-center">
                    비밀번호 바꾸기<i class="ti ti-arrow-right"></i>
                </button>
            </form>
        </div>

    </div>
</main>

<script th:src="@{/js/auth/signup.js}"></script>
</body>
</html>
