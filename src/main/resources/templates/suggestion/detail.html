<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${suggestion.title()} + ' - InsightOn'">제안 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="app-main">
        <p class="section-label">
            <a th:href="@{/suggestions}" style="color:var(--ink-soft); text-decoration:none;">
                <i class="ti ti-arrow-left"></i> 제안
            </a>
        </p>

        <div id="detailContent" class="settings-card" style="max-width: 760px;">
            <div style="display:flex; align-items:center; gap: var(--sp-3); margin-bottom: var(--sp-2);">
                <span class="status-badge neutral" style="margin-top:0;" th:if="${suggestion.isAccepted() == null}">대기중</span>
                <span class="status-badge success" style="margin-top:0;" th:if="${suggestion.isAccepted() == true}">수락됨</span>
                <span class="status-badge danger" style="margin-top:0;" th:if="${suggestion.isAccepted() == false}">거절됨</span>
                <span class="field-hint" style="margin-top:0;" th:text="${suggestion.locationName()}"></span>
                <span class="field-hint" style="margin-top:0;" th:text="${#temporals.format(suggestion.createdAt(), 'yyyy-MM-dd HH:mm')}"></span>
            </div>
            <h2 style="font-size:1.25rem; font-weight:700; color:var(--ink); margin-bottom: var(--sp-4);" th:text="${suggestion.title()}"></h2>
            <div class="report-content" th:text="${suggestion.suggestionText()}"></div>

            <div th:if="${suggestion.actionPayload() != null and not #strings.isEmpty(suggestion.actionPayload())}" style="margin-top: var(--sp-6);">
                <label style="display:block; font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--sp-2);">제안된 동작</label>
                <pre style="background: var(--surface-alt); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--sp-3); font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--ink-soft); white-space: pre-wrap; margin: 0;" th:text="${suggestion.actionPayload()}"></pre>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/chat-widget.js}"></script>
</body>
</html>
