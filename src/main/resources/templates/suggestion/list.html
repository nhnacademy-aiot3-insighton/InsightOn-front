<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>제안 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="app-main">
        <p class="section-label">제안</p>

        <form method="get" th:action="@{/suggestions}" class="filter-bar">
            <select name="locationId" class="form-select">
                <option value="">전체 위치</option>
                <option th:each="loc : ${locations}" th:value="${loc.locationId()}" th:text="${loc.locationName()}"
                        th:selected="${selectedLocationId != null and selectedLocationId == loc.locationId()}"></option>
            </select>
            <button type="submit" class="btn-add-widget">적용</button>
        </form>

        <div class="split-view">
            <div class="split-list">
                <div class="location-summary-list" th:if="${not #lists.isEmpty(suggestions.content())}">
                    <a class="split-row" th:each="suggestion : ${suggestions.content()}"
                       th:href="@{/suggestions/{suggestionId}(suggestionId=${suggestion.suggestionLogId()})}">
                        <div class="split-row-title">
                            <span class="status-badge neutral" style="margin-top:0;" th:if="${suggestion.isAccepted() == null}">대기중</span>
                            <span class="status-badge success" style="margin-top:0;" th:if="${suggestion.isAccepted() == true}">수락됨</span>
                            <span class="status-badge danger" style="margin-top:0;" th:if="${suggestion.isAccepted() == false}">거절됨</span>
                            <span th:text="${suggestion.title()}"></span>
                        </div>
                        <div class="split-row-meta" th:text="${suggestion.locationName()} + ' · ' + ${#temporals.format(suggestion.createdAt(), 'yyyy-MM-dd HH:mm')}"></div>
                    </a>
                </div>

                <p class="grid-widget-empty py-5" th:if="${#lists.isEmpty(suggestions.content())}">
                    조건에 맞는 제안이 없어요.
                </p>
            </div>

            <div id="detailPanel" class="split-detail">
                <p class="split-detail-empty">왼쪽에서 제안을 선택하세요.</p>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/split-detail.js}"></script>
<script th:src="@{/js/chat-widget.js}"></script>
<script>
    initSplitDetail({rowSelector: '.split-list .split-row', panelId: 'detailPanel', contentId: 'detailContent'});
</script>
</body>
</html>
