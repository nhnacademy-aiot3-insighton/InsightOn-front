<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 재설정 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script th:src="@{/js/theme.js}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header class="landing-header">
    <a th:href="${groupId != null} ? @{/my-group} : @{/}" class="brand">
        <i class="ti ti-chart-line"></i>InsightOn
    </a>
    <div class="landing-header-actions" style="margin-left:auto;">
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn-landing-secondary">로그아웃</button>
        </form>
    </div>
</header>

<main class="form-page">
    <div class="form-panel">

        <div class="form-panel-head">
            <span class="form-medallion"><i class="ti ti-lock"></i></span>
            <div>
                <h1>비밀번호 재설정</h1>
                <p>현재 비밀번호를 확인한 뒤 새 비밀번호로 바꿔요.</p>
            </div>
        </div>

        <div class="auth-error" th:if="${passwordError}">
            <i class="ti ti-alert-circle"></i>
            <span th:text="${passwordError}"></span>
        </div>

        <form th:action="@{/mypage/password}" method="post">

            <div class="form-section">
                <div class="form-section-label"><i class="ti ti-shield-lock"></i>본인 확인</div>
                <div class="settings-field">
                    <label for="currentPassword">현재 비밀번호</label>
                    <div class="password-field">
                        <input type="password" id="currentPassword" name="currentPassword" class="form-control" required>
                        <button type="button" class="password-toggle" aria-label="비밀번호 표시"><i class="ti ti-eye"></i></button>
                    </div>
                </div>
            </div>

            <div class="wave-divider"></div>

            <div class="form-section">
                <div class="form-section-label"><i class="ti ti-key"></i>새 비밀번호</div>
                <div class="settings-field">
                    <label for="newPassword">새 비밀번호</label>
                    <p class="field-hint">8자 이상으로 설정해주세요.</p>
                    <div class="password-field">
                        <input type="password" id="newPassword" name="newPassword" class="form-control" minlength="8" required>
                        <button type="button" class="password-toggle" aria-label="비밀번호 표시"><i class="ti ti-eye"></i></button>
                    </div>
                </div>
                <div class="settings-field">
                    <label for="newPasswordConfirm">새 비밀번호 확인</label>
                    <div class="password-field">
                        <input type="password" id="newPasswordConfirm" name="newPasswordConfirm" class="form-control" minlength="8" required>
                        <button type="button" class="password-toggle" aria-label="비밀번호 표시"><i class="ti ti-eye"></i></button>
                    </div>
                    <p id="passwordMatchError" class="field-hint danger" style="display:none;">새 비밀번호가 일치하지 않아요.</p>
                </div>
            </div>

            <div class="form-actions">
                <span class="spacer"></span>
                <a th:href="@{/mypage}" class="btn-landing-secondary">취소</a>
                <button type="submit" class="btn-landing-primary">변경하기</button>
            </div>
        </form>
    </div>
</main>

<script th:src="@{/js/mypage/mypage-password.js}"></script>
</body>
</html>
