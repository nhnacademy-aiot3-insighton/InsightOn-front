<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내 정보 수정 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
          rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header class="landing-header">
    <a th:href="@{/}" class="brand">
        <i class="ti ti-chart-line"></i>InsightOn
    </a>
    <div class="landing-header-actions" style="margin-left:auto;">
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn-landing-secondary">로그아웃</button>
        </form>
    </div>
</header>

<div class="account-shell">

    <div class="account-header">
        <h1>My Page</h1>
    </div>

    <section class="account-section">
        <div class="settings-card">

            <div class="auth-error" th:if="${profileError}">
                <i class="ti ti-alert-circle"></i>
                <span th:text="${profileError}"></span>
            </div>

            <form th:action="@{/mypage/edit}" method="post">

                <div class="settings-field">
                    <label>Email</label>
                    <input type="email" class="form-control" th:value="${email}" disabled>
                    <p class="field-hint">이메일은 변경할 수 없어요.</p>
                </div>

                <div class="settings-field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" class="form-control" th:value="${name}" required>
                </div>

                <div class="settings-field">
                    <label for="phone">PhoneNumber</label>
                    <input type="tel" id="phone" name="phone" class="form-control" th:value="${phone}" required>
                </div>

                <div class="settings-actions">
                    <button type="submit" class="btn-landing-primary">수정하기</button>
                </div>
            </form>
        </div>
    </section>

</div>
</body>
</html>
