<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내 정보 수정 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link rel="icon" href="/img/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
          rel="stylesheet">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header class="landing-header">
    <a th:href="${groupId != null} ? @{/my-group} : @{/}" class="brand">
        <span th:replace="~{fragments/layout :: brandMark}"></span>InsightOn
    </a>
    <div class="landing-header-actions" style="margin-left:auto;">
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn-landing-secondary">로그아웃</button>
        </form>
    </div>
</header>

<main class="form-page">
    <div class="form-panel">

        <div class="form-panel-head">
            <span class="form-medallion"><i class="ti ti-user-edit"></i></span>
            <div>
                <h1>내 정보 수정</h1>
                <p>이름과 연락처를 바꿀 수 있어요.</p>
            </div>
        </div>

        <div class="auth-error" th:if="${profileError}">
            <i class="ti ti-alert-circle"></i>
            <span th:text="${profileError}"></span>
        </div>

        <form th:action="@{/mypage/edit}" method="post">
            <div class="form-section">
                <div class="form-section-label"><i class="ti ti-user"></i>프로필</div>
                <div class="settings-field">
                    <label>이메일</label>
                    <p class="field-hint">이메일은 변경할 수 없어요.</p>
                    <input type="email" class="form-control" th:value="${email}" disabled>
                </div>
                <div class="settings-field">
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" class="form-control" th:value="${name}" required>
                </div>
                <div class="settings-field">
                    <label for="phone">연락처</label>
                    <input type="tel" id="phone" name="phone" class="form-control" th:value="${phone}" required>
                </div>
            </div>

            <div class="form-actions">
                <span class="spacer"></span>
                <a th:href="@{/mypage}" class="btn-landing-secondary">취소</a>
                <button type="submit" class="btn-landing-primary">수정하기</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
