<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${report.title()} + ' - InsightOn'">리포트 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="app-main">
        <p class="section-label">
            <a th:href="@{/my-group/reports}" style="color:var(--ink-soft); text-decoration:none;">
                <i class="ti ti-arrow-left"></i> 리포트
            </a>
        </p>

        <div id="detailContent" class="settings-card" style="max-width: 100%;">
            <div style="display:flex; align-items:center; gap: var(--sp-3); margin-bottom: var(--sp-2);">
                <span class="status-badge neutral" style="margin-top:0;" th:text="${report.reportType().name() == 'WEEKLY'} ? '주간' : '월간'"></span>
                <span class="field-hint" style="margin-top:0;" th:text="${report.locationName()}"></span>
                <span class="field-hint" style="margin-top:0;" th:text="${#temporals.format(report.createdAt(), 'yyyy-MM-dd HH:mm')}"></span>
            </div>
            <h2 style="font-size:1.25rem; font-weight:700; color:var(--ink); margin-bottom: var(--sp-4);" th:text="${report.title()}"></h2>
            <div class="report-content" data-markdown th:text="${report.content()}"></div>

            <!-- 이 리포트가 근거로 삼은 시간별 원자료 — 그래프 대신 문장으로 요약해서 텍스트 진단
                 바로 아래에 붙임(ReportViewService.computeHighlight가 hourly_telemetry_stats를
                 미리 집계해서 넘긴 값) -->
            <div style="margin-top: var(--sp-5); padding-top: var(--sp-4); border-top: 1px solid var(--line);">
                <p class="field-hint" style="margin-top:0;">이 기간 실제 수치</p>
                <p class="field-hint" th:unless="${report.highlight().hasData()}">이 기간에는 집계된 시간별 데이터가 없어요.</p>
                <ul th:if="${report.highlight().hasData()}" style="margin:0; padding-left: 1.1rem; display:flex; flex-direction:column; gap: var(--sp-2);">
                    <li th:if="${report.highlight().peakTemperature() != null}">
                        낮 <span th:text="${#temporals.format(report.highlight().peakTemperatureHour(), 'HH')}">14</span>시경
                        최고 온도는 <strong th:text="${#numbers.formatDecimal(report.highlight().peakTemperature(), 1, 1)} + '도'">26.2도</strong>였고,
                        에어컨은 이 기간 총 <strong th:text="${report.highlight().aircondOnHours()} + '시간'">3.5시간</strong> 가동됐어요.
                    </li>
                    <li th:if="${report.highlight().hasPoorHumidity()}">
                        <span th:text="${#temporals.format(report.highlight().firstPoorHumidityHour(), 'MM-dd HH')}">08-25 09</span>시부터
                        습도가 쾌적 기준(60%)을 넘기 시작했고, 공기청정기는 이 기간 총
                        <strong th:text="${report.highlight().airPurifierOnHours()} + '시간'">5.2시간</strong> 가동됐어요.
                    </li>
                </ul>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/chat-widget.js}"></script>
<script th:src="@{/js/markdown-render.js}"></script>
</body>
</html>
