<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${report.title()} + ' - InsightOn'">리포트 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link rel="icon" href="/img/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="app-main">
        <p class="section-label">
            <a th:href="@{/my-group/reports}" style="color:var(--ink-soft); text-decoration:none;">
                <i class="ti ti-arrow-left"></i> 리포트
            </a>
        </p>

        <div id="detailContent" class="settings-card" style="max-width: 100%;">
            <div style="display:flex; align-items:center; gap: var(--sp-3); margin-bottom: var(--sp-2);">
                <span class="status-badge neutral" style="margin-top:0;" th:text="${report.reportType().name() == 'WEEKLY'} ? '주간' : '월간'"></span>
                <span class="field-hint" style="margin-top:0;" th:text="${report.locationName()}"></span>
                <span class="field-hint" style="margin-top:0;" th:text="${#temporals.format(report.createdAt().withOffsetSameInstant(T(java.time.ZoneOffset).ofHours(9)), 'yyyy-MM-dd HH:mm')}"></span>
            </div>
            <h2 style="font-size:1.25rem; font-weight:700; color:var(--ink); margin-bottom: var(--sp-4);" th:text="${report.title()}"></h2>
            <div class="report-content" data-markdown th:text="${report.content()}"></div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/chat-widget.js}"></script>
<script th:src="@{/js/markdown-render.js}"></script>
</body>
</html>
