<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>리포트 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/layout :: groupHeader}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="app-main">
        <p class="section-label">리포트</p>

        <form method="get" th:action="@{/my-group/reports}" class="filter-bar">
            <select name="locationId" class="form-select">
                <option value="">전체 위치</option>
                <option th:each="loc : ${locations}" th:value="${loc.locationId()}" th:text="${loc.locationName()}"
                        th:selected="${selectedLocationId != null and selectedLocationId == loc.locationId()}"></option>
            </select>
            <select name="reportType" class="form-select">
                <option value="">전체 유형</option>
                <option value="WEEKLY" th:selected="${selectedReportType != null and selectedReportType.name() == 'WEEKLY'}">주간</option>
                <option value="MONTHLY" th:selected="${selectedReportType != null and selectedReportType.name() == 'MONTHLY'}">월간</option>
            </select>
            <button type="submit" class="btn-add-widget">적용</button>
        </form>

        <div class="split-view">
            <div class="split-list">
                <div class="location-summary-list" th:if="${not #lists.isEmpty(reports.content())}">
                    <a class="split-row" th:each="report : ${reports.content()}"
                       th:href="@{/my-group/reports/{reportId}(reportId=${report.reportId()})}">
                        <div class="split-row-title">
                            <span class="status-badge neutral" style="margin-top:0;" th:text="${report.reportType().name() == 'WEEKLY'} ? '주간' : '월간'"></span>
                            <span th:text="${report.title()}"></span>
                        </div>
                        <div class="split-row-meta" th:text="${report.locationName()} + ' · ' + ${#temporals.format(report.createdAt().withOffsetSameInstant(T(java.time.ZoneOffset).ofHours(9)), 'yyyy-MM-dd')}"></div>
                    </a>
                </div>

                <p class="grid-widget-empty py-5" th:if="${#lists.isEmpty(reports.content())}">
                    조건에 맞는 리포트가 없어요.
                </p>
            </div>

            <div id="detailPanel" class="split-detail">
                <p class="split-detail-empty">왼쪽에서 리포트를 선택하세요.</p>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/split-detail.js}"></script>
<script th:src="@{/js/chat-widget.js}"></script>
<script th:src="@{/js/markdown-render.js}"></script>
<script>
    initSplitDetail({rowSelector: '.split-list .split-row', panelId: 'detailPanel', contentId: 'detailContent'});
</script>
</body>
</html>
