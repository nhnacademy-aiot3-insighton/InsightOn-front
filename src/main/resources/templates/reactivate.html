<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>계정 복구 - InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script th:replace="~{fragments/layout :: themeInit}"></script>
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<header class="landing-header">
    <a th:href="@{/}" class="brand">
        <i class="ti ti-chart-line"></i>
        InsightOn
    </a>
</header>

<main class="auth-main">
    <div class="auth-card">

        <h1>계정 복구</h1>
        <p class="auth-subtitle">
            탈퇴 후 복구 가능 기간 내 계정이에요. 이메일로 인증 코드를 받아 계정을 복구하면
            바로 로그인됩니다.
        </p>

        <!-- 서버가 내려주는 에러 메시지 (코드 오류/만료/잠금 등) -->
        <div class="auth-error" th:if="${reactivateError}">
            <i class="ti ti-alert-circle"></i>
            <span th:text="${reactivateError}"></span>
        </div>

        <form th:action="@{/reactivate/confirm}" method="post" id="reactivateForm">

            <div class="settings-field">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" class="form-control"
                       th:value="${email}" placeholder="you@company.com" required autofocus>
            </div>

            <div class="settings-field">
                <button type="button" id="btnSendCode" class="btn btn-outline-secondary w-100">
                    인증 코드 발송
                </button>
                <small class="settings-hint" id="codeStatus" style="display:none;"></small>
            </div>

            <div class="settings-field">
                <label for="code">인증 코드</label>
                <input type="text" id="code" name="code" class="form-control"
                       inputmode="numeric" autocomplete="one-time-code"
                       maxlength="6" pattern="[0-9]{6}" placeholder="6자리 숫자" required>
            </div>

            <button type="submit" class="btn-landing-primary w-100 justify-content-center">
                계정 복구하고 로그인<i class="ti ti-arrow-right"></i>
            </button>
        </form>

        <p class="auth-footer-note">
            <a th:href="@{/login}">로그인으로 돌아가기</a>
        </p>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth/reactivate.js}"></script>
</body>
</html>
