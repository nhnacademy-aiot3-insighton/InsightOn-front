<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>위젯 및 대시보드 테스트</title>
    <!-- Tabler UI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css" rel="stylesheet">
    <!-- Gridstack UI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="${dashboard?.title} != null ? ${dashboard.title} + ' - InsightOn' : '위치 대시보드 - InsightOn'">위치 대시보드 -
        InsightOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/gridstack@latest/dist/gridstack.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header th:replace="~{fragments/layout :: locationHeader(${dashboard?.title} != null ? ${dashboard.title} : ('위치 ' + ${locationId}), ${locationId})}"></header>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="app-main dashboard-shell">
        <div class="dashboard-scroll-area">
            <section class="widget-section" id="widgetSection">
                <div class="section-header">
                    <p class="section-label mb-0">위젯 (InfluxDB 센서 데이터)</p>
                    <div class="widget-toolbar">
                        <button class="btn-add-widget" id="btnAddWidget" type="button">
                            <i class="ti ti-plus"></i>위젯 추가
                        </button>
                        <button class="btn-add-widget btn-add-widget-primary" id="btnSaveLayout" type="button">
                            <i class="ti ti-device-floppy"></i>저장
                        </button>
                    </div>
                </div>

                <p class="section-label" id="saveStatus" style="display:none;"></p>

                <div class="grid-stack" id="widgetGrid"></div>
                <p class="grid-widget-empty py-5" id="widgetEmptyState" style="display:none;">
                    등록된 위젯이 없어요. <strong>위젯 추가</strong>를 눌러 만들어보세요.
                </p>
            </section>
        </div>

        <div class="dashboard-shortcuts">
            <p class="section-label">바로가기</p>
            <div class="row g-2">
                <div class="col-4 col-md-2">
                    <a class="shortcut-card" th:href="@{/reports(locationId=${locationId})}">
                        <span class="shortcut-icon"><i class="ti ti-file-text"></i></span>
                        <div class="shortcut-label">리포트</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a class="shortcut-card" th:href="@{/engine-alerts(locationId=${locationId})}">
                        <span class="shortcut-icon"><i class="ti ti-alert-triangle"></i></span>
                        <div class="shortcut-label">엔진 알람</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a class="shortcut-card" th:href="@{/suggestions(locationId=${locationId})}">
                        <span class="shortcut-icon"><i class="ti ti-bulb"></i></span>
                        <div class="shortcut-label">AI 제안</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a class="shortcut-card" th:href="@{/my-group/hourly-telemetry-stats(locationId=${locationId})}">
                        <span class="shortcut-icon"><i class="ti ti-chart-line"></i></span>
                        <div class="shortcut-label">시간별 통계</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a class="shortcut-card" th:href="@{/locations/{id}/actuators(id=${locationId})}">
                        <span class="shortcut-icon"><i class="ti ti-adjustments"></i></span>
                        <div class="shortcut-label">액추에이터</div>
                    </a>
                </div>
                <div class="col-4 col-md-2">
                    <a class="shortcut-card" th:href="@{/sensors(locationId=${locationId})}">
                        <span class="shortcut-icon"><i class="ti ti-cpu"></i></span>
                        <div class="shortcut-label">센서</div>
                    </a>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- 위젯 설정 모달 -->
<div aria-hidden="true" class="modal fade" id="widgetConfigModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">위젯 설정</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body">
                <div class="widget-config-field">
                    <label>표현 형태</label>
                    <div class="type-choice-group" id="widgetTypeChoices">
                        <label class="type-choice">
                            <input name="widgetType" type="radio" value="GRAPH">
                            <i class="ti ti-chart-line"></i>그래프
                        </label>
                        <label class="type-choice">
                            <input name="widgetType" type="radio" value="BAR">
                            <i class="ti ti-chart-bar"></i>막대 그래프
                        </label>
                        <label class="type-choice">
                            <input name="widgetType" type="radio" value="SINGLE_STAT">
                            <i class="ti ti-gauge"></i>게이지
                        </label>
                    </div>
                </div>
                <div class="widget-config-field">
                    <label for="widgetSensorSelect">센서</label>
                    <select class="form-select" id="widgetSensorSelect">
                        <option value="">센서를 선택하세요</option>
                        <option th:attr="data-eui=${s.sensorEui}"
                                th:each="s : ${sensors}"
                                th:text="${s.sensorName} + ' (' + ${s.sensorEui} + ')'"
                                th:value="${s.sensorId}">
                        </option>
                    </select>
                </div>
                <div class="widget-config-field">
                    <label>가져올 메트릭</label>
                    <div class="metric-check-list" id="widgetMetricList">
                        <p class="metric-check-empty">먼저 센서를 선택하세요.</p>
                    </div>
                </div>
                <div class="row g-3">
                    <div class="col-6 widget-config-field">
                        <label for="widgetRangeSelect">조회 범위</label>
                        <select class="form-select" id="widgetRangeSelect">
                            <option value="-1h">최근 1시간</option>
                            <option value="-6h">최근 6시간</option>
                            <option value="-24h">최근 24시간</option>
                            <option value="-7d">최근 7일</option>
                        </select>
                    </div>
                    <div class="col-6 widget-config-field">
                        <label for="widgetAggSelect">집계 주기</label>
                        <select class="form-select" id="widgetAggSelect">
                            <option value="1m">1분</option>
                            <option value="15m">15분</option>
                            <option value="1h">1시간</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-secondary" data-bs-dismiss="modal" type="button">취소</button>
                <button class="btn btn-primary" id="btnApplyWidgetConfig" type="button">적용</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>

<script th:inline="javascript">
    const DASHBOARD_INIT = {
        groupId: /*[[${groupId}]]*/ 1,
        locationId: /*[[${locationId}]]*/ 1,
        widgets: /*[[${dashboard?.widgetsList}]]*/ []
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gridstack@latest/dist/gridstack-all.js"></script>
<script th:src="@{/js/widget-dashboard.js?v=7}"></script>
<script th:src="@{/js/chat-widget.js}"></script>
</body>
</html>
