spring.application.name=insighton-front

server.port=8080

management.endpoints.web.exposure.include=health

service-url.gateway=http://insighton-gateway

server.tomcat.use-relative-redirects=true

# 정적 자산(js/css)에 no-store를 강제 - CDN/브라우저가 캐싱을 안 하게 해서
# 배포할 때마다 버전 쿼리스트링(?v=)을 수동으로 올려야 하는 캐시버스팅을 안 해도 됨
spring.web.resources.cache.cachecontrol.no-store=true


# 첫 요청에서 브라우저 쿠키가 확인되기 전이라 Tomcat이 세션 유지를 위해 세션 ID를 URL에 심어(;jsessionid) 생기는 것이며,
# 아래 설정으로 세션 추적을 쿠키 전용으로 고정하면 막을 수 있다.
server.servlet.session.tracking-modes=cookie